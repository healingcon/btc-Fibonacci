<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BTC 선물 차트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Courier New',monospace;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit;border:none;outline:none}

/* ── 헤더 ── */
#header{background:#1a2030;border-bottom:1px solid #21262d;padding:6px 10px;flex-shrink:0}
#h1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
#sym-badge{font-size:10px;color:#c9d1d9;background:#21262d;padding:2px 6px;border-radius:3px}
#price{font-size:22px;font-weight:700;letter-spacing:-0.5px}
#chg{font-size:11px;padding:2px 6px;border-radius:3px;font-weight:600}
#conn-badge{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600}
#h2{display:flex;gap:4px;flex-wrap:wrap}
.btn{font-size:10px;padding:3px 9px;border-radius:4px;border:1px solid #30363d;background:transparent;color:#c9d1d9;transition:all .15s}
.btn.on{color:#58a6ff;border-color:#388bfd;background:rgba(56,139,253,.1)}
.btn:active{opacity:.7}
#tf-row{display:flex;gap:3px;margin-bottom:4px}
.tf-btn{font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid #4a5568;background:transparent;color:#c9d1d9}
.tf-btn.on{color:#fff;border-color:#58a6ff;background:#1f6feb}

/* ── 신호 패널 (모바일 최적화) ── */
#sig-panel{background:#1a2030;border-bottom:1px solid #21262d;padding:6px 8px;flex-shrink:0;display:flex;gap:8px;align-items:center}
#sig-left{flex-shrink:0;display:flex;align-items:center;gap:7px}
#ring-wrap{position:relative;width:52px;height:52px}
#ring-wrap svg{width:52px;height:52px;transform:rotate(-90deg)}
#ring-bg{stroke:#21262d}
#ring-arc{stroke:#8b949e;transition:stroke-dashoffset .5s,stroke .4s}
#ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sig-dir{font-size:12px;font-weight:700;color:#c9d1d9}
#sig-pct{font-size:9px;color:#94a3b8}
#sig-verdict{font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px;text-align:center;background:rgba(255,255,255,.04);color:#c9d1d9;border:1px solid #4a5568;white-space:nowrap}
#sig-mid{flex:1;min-width:0;overflow:hidden}
#sig-action{font-size:10px;color:#fbbf24;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
/* 내러티브: 모바일=접힘, 탭하면 펼침 */
#sig-narrative{font-size:9.5px;color:#94a3b8;line-height:1.6;max-height:0;overflow:hidden;transition:max-height .3s ease}
#sig-narrative.open{max-height:200px;overflow-y:auto}
#sig-narrative::-webkit-scrollbar{display:none}
.narr-line{padding:1.5px 0;border-bottom:1px solid #1e2d3d}
#narr-toggle{font-size:8px;color:#7dd3fc;background:none;border:none;cursor:pointer;padding:2px 0;margin-top:1px;font-size:9px}
/* 지표 카드: 가로 한 줄 (모바일) */
#sig-right{flex-shrink:0;display:flex;flex-direction:row;gap:4px}
.ind-box{background:#0d1117;border:1px solid #21262d;border-radius:4px;padding:3px 6px;min-width:52px}
.ind-name{font-size:8px;color:#8b9ab0;letter-spacing:.2px;text-transform:uppercase}
.ind-val{font-size:11px;font-weight:700;color:#e6edf3;line-height:1.2}
.ind-bar{height:2px;background:#21262d;border-radius:2px;margin:2px 0}
.ind-fill{height:2px;border-radius:2px;background:#58a6ff;width:50%}
.ind-desc{font-size:9px;color:#94a3b8}

/* ── 차트 ── */
#chart-wrap{flex:1;position:relative;min-height:0}
#mc,#oc{position:absolute;top:0;left:0;width:100%;height:100%}
#oc{pointer-events:none;z-index:2}
#spinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1117;z-index:10}
.spin{width:28px;height:28px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#spin-msg{font-size:11px;color:#94a3b8;margin-top:8px}

/* ── MTF 위젯 (드래그 가능) ── */
#mtf-widget{
  position:fixed;right:8px;bottom:60px;
  background:rgba(13,17,23,.96);border:1px solid #30363d;border-radius:10px;
  padding:0;font-size:10px;min-width:148px;z-index:50;
  backdrop-filter:blur(8px);user-select:none;touch-action:none;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
#mtf-handle{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px 4px;cursor:grab;border-bottom:1px solid #1a2030;
}
#mtf-handle:active{cursor:grabbing;}
#mtf-title{font-size:8px;color:#a0b0c0;letter-spacing:.3px}
#mtf-minimize{font-size:10px;color:#a0b0c0;background:none;border:none;cursor:pointer;padding:0;line-height:1}
#mtf-body{padding:6px 10px 8px}
.mtf-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid #1e2d3d}
.mtf-row:last-child{border:none}
.mtf-tf{color:#a0b0c0;font-size:9px}
.mtf-sig{font-weight:700;font-size:9px}
#mtf-result{margin-top:5px;padding-top:5px;border-top:1px solid #1e2736;text-align:center}
#mtf-label{font-size:12px;font-weight:900;line-height:1.3}
#mtf-conf-wrap{display:flex;align-items:center;gap:4px;margin-top:4px}
#mtf-conf-bar-bg{flex:1;height:4px;background:#1e2736;border-radius:2px}
#mtf-conf-bar{height:4px;border-radius:2px;background:#fbbf24;width:0%;transition:width .4s}
#mtf-conf-pct{font-size:9px;color:#fbbf24;min-width:28px;text-align:right}

/* ── TG 설정 모달 ── */
#tg-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;align-items:center;justify-content:center}
#tg-modal.show{display:flex}
#tg-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;width:90%;max-width:340px}
#tg-box h3{font-size:14px;margin-bottom:12px;color:#e2e8f0}
.tg-field{margin-bottom:10px}
.tg-field label{font-size:10px;color:#c9d1d9;display:block;margin-bottom:3px}
.tg-field input{width:100%;background:#21262d;border:1px solid #30363d;border-radius:5px;color:#e2e8f0;font-family:inherit;font-size:11px;padding:6px 8px;outline:none}
.tg-btns{display:flex;gap:6px;margin-top:14px}
.tg-btns button{flex:1;padding:8px;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
#tg-save{background:rgba(56,139,253,.2);border:1px solid #388bfd;color:#58a6ff}
#tg-test{background:rgba(52,211,153,.1);border:1px solid #34d399;color:#34d399}
#tg-close{background:transparent;border:1px solid #4a5568;color:#a0b0c0;flex:0 0 36px}

/* ── 거래소/코인 선택 ── */
#exch-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.exch-btn{font-size:10px;padding:3px 10px;border-radius:4px;border:1px solid #4a5568;background:transparent;color:#c9d1d9;font-family:inherit;cursor:pointer}
.exch-btn.on{color:#fff;border-color:#fbbf24;background:rgba(251,191,36,.15)}
#search-wrap{display:flex;align-items:center;gap:4px;flex:1;background:#21262d;border:1px solid #30363d;border-radius:5px;padding:2px 6px;max-width:160px}
#search-input{background:none;border:none;outline:none;color:#e6edf3;font-family:'Courier New',monospace;font-size:11px;width:80px;text-transform:uppercase}
#search-input::placeholder{color:#7a8a9a;text-transform:none}
#search-btn{background:none;border:none;color:#58a6ff;font-size:11px;cursor:pointer;padding:0}
/* 코인 검색 드롭다운 */
#search-dropdown{position:fixed;background:#161b22;border:1px solid #30363d;border-radius:6px;z-index:200;min-width:160px;max-height:200px;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.6);display:none}
#search-dropdown.show{display:block}
.drop-item{padding:6px 10px;cursor:pointer;font-size:11px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.drop-item:last-child{border:none}
.drop-item:hover,.drop-item:active{background:#21262d}
.drop-coin{color:#e6edf3;font-weight:700}
.drop-price{color:#64748b;font-size:10px}
/* ── 뉴스 티커 ── */
#news-bar{background:#0d1117;border-top:1px solid #1e2d3d;height:26px;display:flex;align-items:center;flex-shrink:0;overflow:hidden;position:relative;}
#news-label{flex-shrink:0;background:#1f6feb;color:#fff;font-size:9px;font-weight:700;padding:0 8px;height:100%;display:flex;align-items:center;letter-spacing:.5px;white-space:nowrap;border-right:1px solid #388bfd;z-index:2;}
#news-scroll{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;}
#news-track{display:inline-flex;align-items:center;animation:newsScroll 80s linear infinite;white-space:nowrap;}
#news-track:hover{animation-play-state:paused;}
@keyframes newsScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.news-item{display:inline-flex;align-items:center;gap:5px;padding:0 18px;font-size:10px;color:#c9d1d9;border-right:1px solid #1e2d3d;cursor:pointer;white-space:nowrap;}
.news-item:hover{color:#58a6ff;}
.news-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.news-time{color:#64748b;font-size:9px;}
.news-bull{color:#34d399 !important;}
.news-bear{color:#f87171 !important;}
#news-bar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(to right,transparent,#0d1117);pointer-events:none;z-index:1;}
#news-refresh{flex-shrink:0;background:none;border:none;color:#475569;font-size:10px;padding:0 6px;cursor:pointer;height:100%;border-left:1px solid #1e2d3d;}
#news-refresh:hover{color:#58a6ff;}
/* ── 토스트 ── */
@keyframes fl{0%{opacity:.6}100%{opacity:0}}
</style>
</head>
<body>

<!-- ═══ 헤더 ═══ -->
<div id="header">
  <div id="h1">
    <span id="sym-badge">BTCUSDT PERP</span>
    <span id="price">--</span>
    <span id="chg" style="background:rgba(255,255,255,.05);color:#8b949e">--</span>
    <span id="conn-badge" style="background:rgba(239,68,68,.15);color:#f87171">연결 중</span>
    <button class="btn" id="btnTG" onclick="openTG()" style="margin-left:auto">📱 TG</button>
  </div>
  <!-- 거래소 + 코인 검색 -->
  <div id="exch-row">
    <button class="exch-btn on" id="excBinance" onclick="setExch('binance')">⬡ Binance</button>
    <button class="exch-btn" id="excHL" onclick="setExch('hyperliquid')">◎ Hyperliquid</button>
    <div id="search-wrap">
      <input id="search-input" placeholder="코인 검색..." maxlength="12"
        oninput="onSearchInput()" onkeydown="onSearchKey(event)" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="search-btn" onclick="doSearch()">🔍</button>
    </div>

  <div id="search-dropdown"></div>
  <div id="tf-row">
    <button class="tf-btn on" data-tf="1m">1m</button>
    <button class="tf-btn" data-tf="5m">5m</button>
    <button class="tf-btn" data-tf="15m">15m</button>
    <button class="tf-btn" data-tf="1h">1h</button>
    <button class="tf-btn" data-tf="4h">4h</button>
    <button class="tf-btn" data-tf="1d">1d</button>
  </div>
  <div id="h2">
    <button class="btn on" id="btnFib">📐 Fib</button>
    <button class="btn on" id="btnCloud">☁ 구름대</button>
    <button class="btn on" id="btnEMA99" style="color:#fb923c;border-color:#fb923c55">★ EMA99</button>
    <button class="btn on" id="btnMA">📈 MA골크</button>
    <button class="btn on" id="btnTrend">〜 추세선</button>
    <button class="btn" id="btnAI" onclick="rerunAI()">⟳ 재분석</button>
  </div>
</div>

<!-- ═══ 신호 패널 ═══ -->
<div id="sig-panel">
  <div id="sig-left">
    <div id="ring-wrap">
      <svg viewBox="0 0 52 52"><circle id="ring-bg" cx="26" cy="26" r="20" fill="none" stroke-width="4" stroke-dasharray="125.6"/><circle id="ring-arc" cx="26" cy="26" r="20" fill="none" stroke-width="4" stroke-dasharray="125.6" stroke-dashoffset="125.6" stroke-linecap="round"/></svg>
      <div id="ring-text"><div id="sig-dir">--</div><div id="sig-pct">0%</div></div>
    </div>
    <div id="sig-verdict">분석 중...</div>
  </div>
  <div id="sig-mid">
    <div id="sig-action" style="color:#94a3b8">MTF 분석 대기 중...</div>
    <button id="narr-toggle" onclick="toggleNarr()">▼ 시장 분석 보기</button>
    <div id="sig-narrative"><div class="narr-line" style="color:#94a3b8">데이터 수집 중입니다...</div></div>
  </div>
  <div id="sig-right">
    <div class="ind-box">
      <div class="ind-name">RSI</div>
      <div class="ind-val" id="v-rsi">--</div>
      <div class="ind-bar"><div class="ind-fill" id="f-rsi"></div></div>
      <div class="ind-desc" id="d-rsi">--</div>
    </div>
    <div class="ind-box">
      <div class="ind-name">MACD</div>
      <div class="ind-val" id="v-macd">--</div>
      <div class="ind-bar"><div class="ind-fill" id="f-macd"></div></div>
      <div class="ind-desc" id="d-macd">--</div>
    </div>
    <div class="ind-box">
      <div class="ind-name">BB%</div>
      <div class="ind-val" id="v-bb">--</div>
      <div class="ind-bar"><div class="ind-fill" id="f-bb"></div></div>
      <div class="ind-desc" id="d-bb">--</div>
    </div>
  </div>
</div>

<!-- ═══ 차트 ═══ -->
<div id="chart-wrap">
  <canvas id="mc"></canvas>
  <canvas id="oc"></canvas>
  <div id="spinner"><div class="spin"></div><div id="spin-msg">연결 중...</div></div>
  <div id="mtf-widget">
    <div id="mtf-handle">
      <span id="mtf-title">⠿ MTF 통합 신호</span>
      <button id="mtf-minimize" onclick="toggleMTF()">－</button>
    </div>
    <div id="mtf-body">
      <div id="mtf-rows">
        <div class="mtf-row"><span class="mtf-tf">15분봉</span><span class="mtf-sig" id="ms-15m" style="color:#94a3b8">--</span></div>
        <div class="mtf-row"><span class="mtf-tf">1시간봉</span><span class="mtf-sig" id="ms-1h" style="color:#94a3b8">--</span></div>
        <div class="mtf-row"><span class="mtf-tf">4시간봉</span><span class="mtf-sig" id="ms-4h" style="color:#94a3b8">--</span></div>
      </div>
      <div id="mtf-result">
        <div id="mtf-label" style="color:#94a3b8">분석 중...</div>
        <div id="mtf-conf-wrap">
          <div id="mtf-conf-bar-bg"><div id="mtf-conf-bar"></div></div>
          <span id="mtf-conf-pct">0%</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ 뉴스 티커 ═══ -->
<div id="news-bar">
  <div id="news-label">📰 NEWS</div>
  <div id="news-scroll">
    <div id="news-track">
      <div class="news-item"><span class="news-dot" style="background:#475569"></span><span style="color:#475569">뉴스 로딩 중...</span></div>
    </div>
  </div>
  <button id="news-refresh" onclick="loadNews()" title="새로고침">⟳</button>
</div>

<!-- ═══ TG 모달 ═══ -->
<div id="tg-modal">
  <div id="tg-box">
    <h3>📱 텔레그램 설정</h3>
    <div style="font-size:9px;color:#64748b;margin-bottom:10px;line-height:1.6">
      1. @BotFather → /newbot → 봇 생성<br>
      2. @userinfobot → 아무 메시지 → Chat ID 확인
    </div>
    <div class="tg-field"><label>봇 토큰</label><input id="tg-tok" placeholder="1234567890:ABCdef..."></div>
    <div class="tg-field"><label>Chat ID</label><input id="tg-cid" placeholder="123456789"></div>
    <div class="tg-field"><label>최소 신뢰도 (%)</label><input id="tg-sc" type="number" value="65" min="40" max="95"></div>
    <div class="tg-btns">
      <button id="tg-save" onclick="saveTG()">저장</button>
      <button id="tg-test" onclick="testTG()">테스트</button>
      <button id="tg-close" onclick="closeTG()">✕</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
// ══════════════════════════════════════════════════════════
// BTC 선물 차트 — 완전 새 버전
// 지표: 피보나치 + 구름대(일목) + EMA99 + MA20/60 + 추세선
// 신호: MTF 15m/1h/4h 기반 (구름대 위치 + EMA99 + MA골크)
// ══════════════════════════════════════════════════════════

// roundRect 폴리필 (iOS Safari 호환)
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

// ── 상수 ──────────────────────────────────────────────────
const FAPI='https://fapi.binance.com/fapi/v1';
const HLAPI='https://api.hyperliquid.xyz/info';
const FIB_R=[0,.236,.382,.5,.618,.786,1];
const FIB_C=['#ff6b6b','#ffa94d','#ffe066','#94d82d','#63e6be','#74c0fc','#a9a9ff'];
const FIB_N=['고점','23.6%','38.2%','50%','★61.8%','78.6%','저점'];
const VOLH=55;

// 인기 코인 목록 (자동완성용)
const POPULAR_COINS=['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX','LINK','DOT',
  'MATIC','UNI','ATOM','LTC','BCH','FIL','APT','ARB','OP','INJ',
  'SUI','TIA','NEAR','FTM','SAND','MANA','AXS','GALA','IMX','BLUR',
  'WLD','PEPE','FLOKI','BONK','WIF','BOME','ORDI','SATS','STX','RUNE'];

// ── 상태 ──────────────────────────────────────────────────
let candles=[],tf='1m',currentSym='BTCUSDT',openPrice=0;
let currentExch='binance'; // 'binance' | 'hyperliquid'
let hlMeta={}; // Hyperliquid 코인 메타 캐시
let ws=null,wsAlive=false;
let pollId=null,oiPollId=null,fundPollId=null;
let aiFib=null,aiLines=[],aiChannels=[];
let fundingRate=null,lsRatio=null;
let lastSigDir=null;
let mtfCache={},mtfTimer=null,mtfRunning=false;
let _drawPending=false,_aiTimer=null;
const MTF_TFS=['15m','1h','4h'];
const MTF_LABEL={'15m':'15분봉','1h':'1시간봉','4h':'4시간봉'};

// TG 설정
let TG={token:'',chatId:'',minConf:65,on:false,cooldown:{}};
try{
  const t=localStorage.getItem('btc_tg_tok'),c=localStorage.getItem('btc_tg_cid'),s=localStorage.getItem('btc_tg_sc');
  if(t&&c){TG.token=t;TG.chatId=c;TG.on=true;if(s)TG.minConf=+s||65;}
}catch(e){}

// 표시 토글
let show={fib:true,cloud:true,ema99:true,ma:true,trend:true};

// ── 캔버스 ────────────────────────────────────────────────
const mc=document.getElementById('mc');
const oc=document.getElementById('oc');
const ctx=mc.getContext('2d');
const oct=oc.getContext('2d');
const mob=()=>window.innerWidth<600;

function resize(){
  const W=mc.parentElement.clientWidth||window.innerWidth;
  const H=Math.max(mc.parentElement.clientHeight||300,200);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  mc.width=oc.width=W*dpr;mc.height=oc.height=H*dpr;

}

function p2y(p,mn,mx,a){return a.y0+(a.y1-a.y0)*(1-(p-mn)/(mx-mn||1));}
function i2x(i,n,a){return a.x0+(i+.5)*(a.x1-a.x0)/n;}
function priceRange(vis){

  let mn=Infinity,mx=-Infinity;
  vis.forEach(c=>{if(c.low<mn)mn=c.low;if(c.high>mx)mx=c.high;});

}
function fmt(p){

// ── 지표 계산 ─────────────────────────────────────────────
function emaArr(arr,p){
  if(arr.length<1)return[];
  const k=2/(p+1),res=[arr[0]];
  for(let i=1;i<arr.length;i++)res.push(arr[i]*k+res[i-1]*(1-k));
  return res;
}
function calcRSI(closes,p=14){
  if(closes.length<p+2)return 50;
  let ag=0,al=0;
  for(let i=closes.length-p;i<closes.length;i++){const d=closes[i]-closes[i-1];d>=0?ag+=d:al-=d;}
  ag/=p;al/=p;return al===0?100:100-100/(1+ag/al);
}
function calcMACD(closes){
  if(closes.length<35)return{hist:0,macd:0,crossUp:false,crossDn:false};
  const e12=emaArr(closes,12),e26=emaArr(closes,26);
  const ml=e12.map((v,i)=>v-e26[i]),sl=emaArr(ml,9);
  const n=ml.length-1;
  return{hist:ml[n]-sl[n],macd:ml[n],signal:sl[n],
    crossUp:ml[n-1]<=sl[n-1]&&ml[n]>sl[n],
    crossDn:ml[n-1]>=sl[n-1]&&ml[n]<sl[n]};
}
function calcBB(closes,p=20){
  if(closes.length<p)return null;
  const sl=closes.slice(-p),ma=sl.reduce((a,b)=>a+b)/p;
  const std=Math.sqrt(sl.reduce((s,v)=>s+(v-ma)**2,0)/p);
  const last=closes[closes.length-1];
  return{upper:ma+2*std,mid:ma,lower:ma-2*std,
    pct:Math.max(0,Math.min(100,((last-(ma-2*std))/(4*std||1))*100)),
    aboveMid:last>ma};
}
function calcMA(closes,p){
  if(closes.length<p)return null;
  return closes.slice(-p).reduce((a,b)=>a+b)/p;
}
function calcIchimoku(cs){
  const hi=(a,s,e)=>Math.max(...a.slice(s,e).map(c=>c.high));
  const lo=(a,s,e)=>Math.min(...a.slice(s,e).map(c=>c.low));
  return cs.map((_,i,a)=>{
    const tk=i>=8?(hi(a,i-8,i+1)+lo(a,i-8,i+1))/2:null;
    const kj=i>=25?(hi(a,i-25,i+1)+lo(a,i-25,i+1))/2:null;
    const sA=(tk&&kj)?(tk+kj)/2:null;
    const sB=i>=51?(hi(a,i-51,i+1)+lo(a,i-51,i+1))/2:null;
    return{tenkan:tk,kijun:kj,spanA:sA,spanB:sB};
  });
}

// ── 피보나치 자동 감지 ────────────────────────────────────
function detectFib(vis){
  if(vis.length<20)return;
  const n=vis.length;
  // 최근 80개 캔들에서 스윙 고점/저점 감지
  const look=Math.min(80,n);
  const sub=vis.slice(-look);
  let hiI=0,loI=0;
  sub.forEach((c,i)=>{
    if(c.high>sub[hiI].high)hiI=i;
    if(c.low<sub[loI].low)loI=i;
  });
  const hiP=sub[hiI].high,loP=sub[loI].low;
  const range=hiP-loP;
  if(range/hiP<0.005)return; // 너무 좁으면 스킵
  // 이상값 필터
  const lastClose=vis[n-1].close;
  if(hiP>lastClose*1.5||loP<lastClose*0.5)return;
  aiFib={high:hiP,low:loP,hiI:n-look+hiI,loI:n-look+loI};
}

// ── 추세선 감지 ───────────────────────────────────────────
function detectLines(vis){
  aiLines=[];aiChannels=[];
  if(vis.length<30)return;
  const n=vis.length;
  // 최근 50개 피벗 고점/저점으로 추세선
  const pts=[];
  for(let i=2;i<Math.min(50,n)-2;i++){
    const c=vis[n-1-i];
    const isHi=vis[n-i].high>=vis[n-i-1].high&&vis[n-i].high>=vis[n-i+1].high;
    const isLo=vis[n-i].low<=vis[n-i-1].low&&vis[n-i].low<=vis[n-i+1].low;
    if(isHi)pts.push({i:n-1-i,p:c.high,type:'hi'});
    if(isLo)pts.push({i:n-1-i,p:c.low,type:'lo'});
  }
  // 최근 상승 추세선 (저점 연결)
  const loPts=pts.filter(p=>p.type==='lo').slice(0,6);
  if(loPts.length>=2){
    const p1=loPts[0],p2=loPts[loPts.length-1];
    if(p1.i!==p2.i) aiLines.push({i0:p2.i,p0:p2.p,i1:p1.i,p1:p1.p,type:'sup'});
  }
  // 최근 하락 추세선 (고점 연결)
  const hiPts=pts.filter(p=>p.type==='hi').slice(0,6);
  if(hiPts.length>=2){
    const p1=hiPts[0],p2=hiPts[hiPts.length-1];
    if(p1.i!==p2.i) aiLines.push({i0:p2.i,p0:p2.p,i1:p1.i,p1:p1.p,type:'res'});
  }
}

// ── 신호 계산 (타임프레임 하나) ───────────────────────────
function calcTF(cs){
  if(!cs||cs.length<30)return{dir:'neutral',conf:0,detail:{}};
  const closes=cs.map(c=>c.close),last=cs[cs.length-1],n=closes.length;
  let ls=0,ss=0;const det={};

  // ── A. 구름대 (핵심 — 최대 65점) ────────────────────────
  if(n>=52){
    const ichi=calcIchimoku(cs);
    const ic=ichi[n-1],icp=ichi[n-2],icp2=ichi[n-3];
    if(ic?.spanA&&ic?.spanB){
      const top=Math.max(ic.spanA,ic.spanB),bot=Math.min(ic.spanA,ic.spanB);
      const thick=(top-bot)/last.close; // 구름 두께 비율
      det.cloudTop=top;det.cloudBot=bot;det.bullCloud=ic.spanA>ic.spanB;
      det.cloudThick=thick;

      if(last.close>top){
        // 구름 위: 상승구름이면 추가 점수
        ls+=det.bullCloud?42:30;
        det.cloudPos='above';
        // 구름 돌파 감지 (이전 캔들이 구름 안/아래였다면)
        if(icp?.spanA&&icp?.spanB){
          const prevTop=Math.max(icp.spanA,icp.spanB);
          if(cs[n-2]?.close<=prevTop){
            ls+=18; // 돌파 순간 강한 추가 점수
            det.cloudBreak='up';
          }
        }
      }else if(last.close<bot){
        ss+=!det.bullCloud?42:30;
        det.cloudPos='below';
        if(icp?.spanA&&icp?.spanB){
          const prevBot=Math.min(icp.spanA,icp.spanB);
          if(cs[n-2]?.close>=prevBot){
            ss+=18;
            det.cloudBreak='down';
          }
        }
      }else{
        det.cloudPos='inside';
        // 구름 안 — 어느 방향인지 힌트
        const midCloud=(top+bot)/2;
        if(last.close>midCloud){ls+=5;det.cloudPos='inside_upper';}
        else{ss+=5;det.cloudPos='inside_lower';}
      }

      // 전환선/기준선 관계
      if(ic.tenkan&&ic.kijun){
        det.tenkan=ic.tenkan;det.kijun=ic.kijun;
        const gap=Math.abs(ic.tenkan-ic.kijun)/last.close*100;
        if(ic.tenkan>ic.kijun){
          ls+=gap>0.3?12:7; // 간격 클수록 추가 점수
        }else{
          ss+=gap>0.3?12:7;
        }
      }
    }
  }

  // ── B. EMA99 (추세 필터 — 최대 20점) ────────────────────
  if(n>=99){
    const e99=emaArr(closes,99);
    const v=e99[n-1],vp=e99[n-2];
    det.ema99=v;det.aboveEMA99=last.close>v;
    const distPct=Math.abs(last.close-v)/v*100;
    if(last.close>v){
      ls+=distPct>1?18:12; // 멀리 떨어질수록 추세 강함
      if(cs[n-2]?.close<=vp&&last.close>v){ls+=5;det.ema99Break='up';}
    }else{
      ss+=distPct>1?18:12;
      if(cs[n-2]?.close>=vp&&last.close<v){ss+=5;det.ema99Break='down';}
    }
  }else if(n>=55){
    const e55=emaArr(closes,55).at(-1);
    if(last.close>e55)ls+=10;else ss+=10;
  }

  // ── C. MA20/60 (중기방향 — 최대 28점) ───────────────────
  if(n>=62){
    const ma20=calcMA(closes,20),ma60=calcMA(closes,60);
    const ma20p=calcMA(closes.slice(0,-1),20),ma60p=calcMA(closes.slice(0,-1),60);
    det.ma20=ma20;det.ma60=ma60;
    if(ma20&&ma60&&ma20p&&ma60p){
      if(ma20>ma60&&ma20p<=ma60p){ls+=28;det.cross='golden';}
      else if(ma20<ma60&&ma20p>=ma60p){ss+=28;det.cross='dead';}
      else if(ma20>ma60&&last.close>ma20){ls+=18;det.maDir='정배열';}
      else if(ma20<ma60&&last.close<ma60){ss+=18;det.maDir='역배열';}
      else if(ma20>ma60)ls+=8;else ss+=8;
    }
  }

  // ── D. 거래량 확인 (최대 20점) ───────────────────────────
  if(n>=20){
    const avg=cs.slice(-20).map(c=>c.vol).reduce((a,b)=>a+b)/20;
    const ratio=last.vol/(avg||1);det.volRatio=ratio;
    const isUp=last.close>=last.open;
    if(ratio>=2.5){
      if(isUp){ls+=20;det.volDir='buy';}else{ss+=20;det.volDir='sell';}
    }else if(ratio>=1.5){
      if(isUp){ls+=12;det.volDir='buy';}else{ss+=12;det.volDir='sell';}
    }
    // 매수압/매도압 (최근 10개 캔들)
    let bv=0,sv=0;cs.slice(-10).forEach(c=>c.close>=c.open?bv+=c.vol:sv+=c.vol);
    det.buyPct=bv/(bv+sv||1)*100;
    if(det.buyPct>=65)ls+=8;
    else if(det.buyPct<=35)ss+=8;
  }

  // ── E. 연속 캔들 확인 (최대 10점) — 추가 필터 ───────────
  // 최근 3개 캔들이 같은 방향이면 추세 신뢰도 ↑
  if(n>=5){
    const last3=cs.slice(-3);
    const allUp=last3.every(c=>c.close>c.open);
    const allDown=last3.every(c=>c.close<c.open);
    if(allUp){ls+=10;det.consecutive='up';}
    else if(allDown){ss+=10;det.consecutive='down';}
  }

  // ── 방향 결정 (기준 낮춤: 45점 → 신호 더 잘 발생) ───────
  const THRESH=45;
  const dir=ls>=THRESH&&ls>ss?'long':ss>=THRESH&&ss>ls?'short':'neutral';

  // 신뢰도: 점수 차이도 반영 (ls와 ss가 비슷하면 신뢰도 낮춤)
  const raw=dir==='long'?ls:dir==='short'?ss:0;
  const diff=dir==='long'?(ls-ss):dir==='short'?(ss-ls):0;
  const diffBonus=Math.min(15,Math.floor(diff/5)); // 점수 차이 보너스
  const conf=Math.max(0,Math.min(100,
    Math.round((raw-THRESH)/(110-THRESH)*100) + diffBonus
  ));

  return{dir,conf,ls,ss,det,rsi:calcRSI(closes),
    ma20:calcMA(closes,20),ma60:calcMA(closes,60)};
}

// ── MTF 통합 신호 ─────────────────────────────────────────
function getMTFLevel(res){
  const tf4 = res['4h']?.tf  || {dir:'neutral',conf:0,det:{}};
  const tf1  = res['1h']?.tf  || {dir:'neutral',conf:0,det:{}};
  const tf15 = res['15m']?.tf || {dir:'neutral',conf:0,det:{}};

  /* ── 점수 기반 통합 판단 ──────────────────────────────────
   * 4h 방향에만 종속되지 않고 점수 합산으로 판단
   * → 하락 추세 중 1h+15m 반전도 잡을 수 있음            */

  // 각 TF 점수 (long=양수, short=음수)
  const score4  = tf4.dir==='long'  ? tf4.conf  : tf4.dir==='short'  ? -tf4.conf  : 0;
  const score1  = tf1.dir==='long'  ? tf1.conf  : tf1.dir==='short'  ? -tf1.conf  : 0;
  const score15 = tf15.dir==='long' ? tf15.conf : tf15.dir==='short' ? -tf15.conf : 0;

  // 가중 합산 (4h:50%, 1h:30%, 15m:20%)
  const weighted = score4*0.50 + score1*0.30 + score15*0.20;

  // 각 TF 방향
  const d4  = tf4.dir,  d1 = tf1.dir,  d15 = tf15.dir;

  // 구름대 돌파 보너스 (강한 추세 전환 신호)
  const cloudBreak4  = tf4.det?.cloudBreak;
  const cloudBreak1  = tf1.det?.cloudBreak;
  const cloudBreak15 = tf15.det?.cloudBreak;

  // 펀딩/롱숏 보정
  let bonus=0;
  if(fundingRate!==null){
    if(fundingRate< -.05) bonus+=6;  // 숏 과열 → 롱 유리
    if(fundingRate>  .10) bonus-=6;  // 롱 과열 → 숏 유리
    if(fundingRate>  .05) bonus-=3;
    if(fundingRate< -.02) bonus+=3;
  }
  if(lsRatio){
    if(lsRatio.shortPct>70) bonus+=5;  // 숏 과다 → 롱 반전
    if(lsRatio.longPct >80) bonus-=5;  // 롱 과다 → 숏 반전
  }

  /* ── 신호 단계 결정 ───────────────────────────────────────
   *
   * 강한 롱: 3개 모두 롱 OR (4h숏이지만 1h+15m 롱 + 구름돌파)
   * 롱 대기: 2개 이상 롱 방향
   * 롱 준비: 1h나 15m 롱 전환 시작
   * 관망: 방향 혼재
   * (숏도 동일 구조)
   */

  const allLong  = d4==='long'  && d1==='long'  && d15==='long';
  const allShort = d4==='short' && d1==='short'  && d15==='short';

  // 반전 감지: 4h는 반대지만 1h+15m 구름 돌파로 추세 전환 초기
  const reversalLong  = d4==='short' && d1==='long'  && d15==='long'
    && (cloudBreak1==='up' || cloudBreak15==='up');
  const reversalShort = d4==='long'  && d1==='short' && d15==='short'
    && (cloudBreak1==='down' || cloudBreak15==='down');

  // 2개 일치
  const twoLong  = [d4,d1,d15].filter(d=>d==='long').length  >= 2;
  const twoShort = [d4,d1,d15].filter(d=>d==='short').length >= 2;

  // 신뢰도 계산
  function calcConf(isL){
    let c = Math.abs(weighted) + bonus*(isL?1:-1);
    // 구름 돌파 보너스
    if(isL){
      if(cloudBreak4==='up')  c+=20;
      if(cloudBreak1==='up')  c+=15;
      if(cloudBreak15==='up') c+=10;
    } else {
      if(cloudBreak4==='down')  c+=20;
      if(cloudBreak1==='down')  c+=15;
      if(cloudBreak15==='down') c+=10;
    }
    return Math.max(0,Math.min(100,Math.round(c)));
  }

  // ── 강한 롱 ──────────────────────────────────────────────
  if(allLong){
    return{level:2,label:'🚀 강한 롱',sub:'LONG ●●●',col:'#10b981',
      action:'3개 TF 롱 일치 — 진입 검토',conf:calcConf(true)};
  }
  // ── 반전 롱 (하락 중 반등 포착) ──────────────────────────
  if(reversalLong){
    return{level:2,label:'🔄 반전 롱',sub:'LONG ●●●',col:'#34d399',
      action:'구름 돌파 — 추세 전환 초기',conf:calcConf(true)};
  }
  // ── 강한 숏 ──────────────────────────────────────────────
  if(allShort){
    return{level:-2,label:'💀 강한 숏',sub:'SHORT ●●●',col:'#ef4444',
      action:'3개 TF 숏 일치 — 진입 검토',conf:calcConf(false)};
  }
  // ── 반전 숏 ──────────────────────────────────────────────
  if(reversalShort){
    return{level:-2,label:'🔄 반전 숏',sub:'SHORT ●●●',col:'#f87171',
      action:'구름 이탈 — 추세 전환 초기',conf:calcConf(false)};
  }
  // ── 롱 대기 (2개 일치) ───────────────────────────────────
  if(twoLong && weighted>5){
    const missing = d4!=='long'?'4h':d1!=='long'?'1h':'15m';
    return{level:1,label:'📈 롱 대기',sub:'LONG ●●○',col:'#34d399',
      action:`${missing} 롱 확인 후 진입`,conf:calcConf(true)};
  }
  // ── 숏 대기 (2개 일치) ───────────────────────────────────
  if(twoShort && weighted<-5){
    const missing = d4!=='short'?'4h':d1!=='short'?'1h':'15m';
    return{level:-1,label:'📉 숏 대기',sub:'SHORT ●●○',col:'#f87171',
      action:`${missing} 숏 확인 후 진입`,conf:calcConf(false)};
  }
  // ── 롱/숏 준비 (1개만) ───────────────────────────────────
  if(weighted>15){
    return{level:0.5,label:'📊 롱 준비',sub:'LONG ●○○',col:'#6ee7b7',
      action:'추가 확인 필요',conf:calcConf(true)};
  }
  if(weighted<-15){
    return{level:-0.5,label:'📊 숏 준비',sub:'SHORT ●○○',col:'#fca5a5',
      action:'추가 확인 필요',conf:calcConf(false)};
  }

  // 관망
  return{level:0,label:'⏸ 관망',sub:'WAIT',col:'#fbbf24',
    action:'방향 혼재 — 대기',conf:0};
}

// ── MTF 분석 실행 ─────────────────────────────────────────
async function runMTF(){
  if(mtfRunning)return;mtfRunning=true;
  const sym=currentSym,now=Date.now();
  const res={};
  const ttl={'15m':60000,'1h':180000,'4h':600000};
  for(const t of MTF_TFS){
    try{
      let cs;
      const cached=mtfCache[t];
      if(cached&&now-cached.ts<ttl[t])cs=cached.candles;
      else{
        if(currentExch==='hyperliquid'){
          cs=await fetchHLCandles(sym,t,220);
        } else {
          const d=await fetchJSON(`${FAPI}/klines?symbol=${sym}&interval=${t}&limit=220`);
          cs=d.map(k=>({time:+k[0],open:+k[1],high:+k[2],low:+k[3],close:+k[4],vol:+k[5]}))
            .filter(c=>c.open>0&&c.close>0);
        }
        mtfCache[t]={candles:cs,ts:now};
      }
      const tfr=calcTF(cs);
      const rsi=tfr.rsi,macd=calcMACD(cs.map(c=>c.close)),bb=calcBB(cs.map(c=>c.close));
      res[t]={tf:tfr,rsi,macd,bb,price:cs[cs.length-1].close};
      // 5m/15m 구름대 이탈/돌파 실시간 감지
      checkCloudBreak(t,cs);
    }catch(e){console.warn('MTF',t,e.message);}
  }
  mtfRunning=false;
  updateMTFUI(res);
  checkTGSignal(res);
}

      macd?.crossUp?'골든크로스':macd?.crossDn?'데드크로스':macd?.hist>0?'상승':'하락',

      bb.pct>75?'#f85149':bb.pct<25?'#3fb950':'#58a6ff');}

}

// iOS Safari 미지원, 안드로이드/PWA 지원
function vibrate(pattern){
  try{
    if(navigator.vibrate) navigator.vibrate(pattern);
  }catch(e){}
}
let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx) _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return _audioCtx;
}
function playSignalSound(isLong){
  try{
    const ctx=getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();

    const playTone=(freq,start,dur,vol=0.3,type='sine')=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type=type;osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,ctx.currentTime+start);
      gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      osc.start(ctx.currentTime+start);
      osc.stop(ctx.currentTime+start+dur+0.05);
    };

    if(isLong){
      // 🚀 롱 — 상승 3단 화음 (밝고 힘차게)
      playTone(440, 0.0, 0.3, 0.25, 'sine');   // A4
      playTone(523, 0.0, 0.3, 0.15, 'sine');   // C5 (화음)
      playTone(550, 0.25, 0.35, 0.25, 'sine'); // C#5
      playTone(659, 0.25, 0.35, 0.15, 'sine'); // E5
      playTone(659, 0.55, 0.5, 0.30, 'sine');  // E5
      playTone(880, 0.55, 0.5, 0.18, 'sine');  // A5
      // 효과음 레이어
      playTone(220, 0.0, 0.15, 0.08, 'sawtooth');
      playTone(330, 0.25, 0.15, 0.08, 'sawtooth');
    } else {
      // 💀 숏 — 하강 3단 (묵직하고 경고음)
      playTone(440, 0.0, 0.3, 0.25, 'sine');   // A4
      playTone(370, 0.0, 0.3, 0.15, 'sine');   // F#4
      playTone(330, 0.28, 0.35, 0.25, 'sine'); // E4
      playTone(277, 0.28, 0.35, 0.15, 'sine'); // C#4
      playTone(220, 0.58, 0.6, 0.30, 'sine');  // A3 (낮고 묵직)
      playTone(185, 0.58, 0.6, 0.18, 'sine');  // F#3
      // 경고 효과음
      playTone(110, 0.0, 0.2, 0.1, 'square');
      playTone(98,  0.28, 0.2, 0.1, 'square');
    }
  }catch(e){console.warn('소리 오류:',e);}
}

// ── 5m/15m 구름대 이탈/돌파 감지 ────────────────────────
let lastCloudState={'5m':null,'15m':null}; // 'above'|'below'|'inside'|null
let cloudAlertCooldown={'5m':0,'15m':0};

function checkCloudBreak(tf2,cs){
  if(!['5m','15m'].includes(tf2))return;
  if(!cs||cs.length<52)return;
  const now=Date.now();
  if(now-cloudAlertCooldown[tf2]<3*60000)return; // 3분 쿨다운

  const ichi=calcIchimoku(cs);
  const n=cs.length;
  const ic=ichi[n-1],icp=ichi[n-2];
  if(!ic?.spanA||!ic?.spanB)return;

  const top=Math.max(ic.spanA,ic.spanB),bot=Math.min(ic.spanA,ic.spanB);
  const lc=cs[n-1].close;
  const prevLc=cs[n-2]?.close||lc;

  let curPos=lc>top?'above':lc<bot?'below':'inside';
  let prevPos=prevLc>Math.max(icp?.spanA||0,icp?.spanB||0)?'above'
    :prevLc<Math.min(icp?.spanA||Infinity,icp?.spanB||Infinity)?'below':'inside';

  const prev=lastCloudState[tf2];

  // 최초 로드 시 현재 상태만 저장
  if(prev===null){lastCloudState[tf2]=curPos;return;}

  // 상태 변화 감지
  if(curPos!==prev){
    lastCloudState[tf2]=curPos;
    const isBreakUp=(curPos==='above'&&prev!=='above');
    const isBreakDown=(curPos==='below'&&prev!=='below');
    if(isBreakUp||isBreakDown){
      cloudAlertCooldown[tf2]=now;
      const price=lc;
      const bullCloud=ic.spanA>ic.spanB;
      showCloudBreakAlert(tf2,isBreakUp,price,bullCloud,top,bot);
    }
  }
}

  const tfLabel=tf2==='5m'?'5분봉':'15분봉';
  const breakLabel=isUp?'구름대 상향돌파 ☁↑':'구름대 하향이탈 ☁↓';
  const strengthLabel=isStrong?'⚡ 강한 신호':'📌 신호';

  el.innerHTML=`
    <style>
      @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
      @keyframes cPulse{0%,100%{border-color:${finalCol}}50%{border-color:transparent}}
      #cloud-alert{animation:slideUp .35s ease, cPulse 1s ease infinite .35s;}
    </style>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <!-- 아이콘 -->
        <div style="font-size:36px;filter:drop-shadow(0 0 10px ${finalCol})">
          ${isUp?'☁⬆':'☁⬇'}
        </div>
        <div>
          <div style="font-size:13px;font-weight:900;color:${finalCol};letter-spacing:.5px">
            ${strengthLabel} — ${tfLabel} ${breakLabel}
          </div>
          <div style="font-size:11px;color:#e6edf3;margin-top:2px">
            ${currentSym}  $${fmt(price)}
            <span style="color:${finalCol};margin-left:8px">
              ${isUp?`▶ 구름 위 (${bullCloud?'상승구름 — 강세':'하락구름 — 주의'})`:
                      `▶ 구름 아래 (${!bullCloud?'하락구름 — 약세':'상승구름 — 주의'})`}
            </span>
          </div>
          <div style="font-size:10px;color:#94a3b8;margin-top:2px">
            구름 상단 $${fmt(cloudTop)}  |  하단 $${fmt(cloudBot)}
          </div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:11px;color:#64748b;margin-bottom:4px">
          ${isStrong?'👉 방향 확인 후 진입 검토':'👉 상위 봉 확인 필요'}
        </div>
        <button onclick="document.getElementById('cloud-alert')?.remove()"
          style="background:${finalCol}22;border:1px solid ${finalCol}55;color:${finalCol};

function playCloudSound(isUp,isStrong){
  try{
    const ac=getAudioCtx();
    if(ac.state==='suspended')ac.resume();
    const t=(freq,start,dur,vol,type='sine')=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0,ac.currentTime+start);
      g.gain.linearRampToValueAtTime(vol,ac.currentTime+start+.02);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+start+dur);
      o.start(ac.currentTime+start);o.stop(ac.currentTime+start+dur+.05);
    };
    if(isStrong){
      if(isUp){t(523,.0,.25,.22);t(659,.22,.3,.22);t(784,.44,.4,.25);}
      else{t(494,.0,.25,.22);t(392,.22,.3,.22);t(330,.44,.4,.25);}
    } else {
      // 약한 알림 (짧게 2음)
      if(isUp){t(523,.0,.2,.15);t(659,.2,.25,.15);}
      else{t(440,.0,.2,.15);t(370,.2,.25,.15);}
    }
  }catch(e){}
}
function scheduleDraw(){
  if(_drawPending)return;_drawPending=true;
  requestAnimationFrame(()=>{_drawPending=false;draw();});
}
function scheduleAI(){
  clearTimeout(_aiTimer);
  _aiTimer=setTimeout(()=>{detectFib(getVis());detectLines(getVis());scheduleDraw();},500);
}

function draw(){
  const a=area(),W=mc.clientWidth,H=mc.clientHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  const vis=getVis();
  if(!vis.length){return;}
  const{min:mn,max:mx}=priceRange(vis);
  const N=vis.length,cw=Math.max(2,(a.x1-a.x0)/N-1);
  const lf=mob()?'8px Courier New':'9px Courier New';

  // 그리드
  for(let i=0;i<=4;i++){
    const y=a.y0+(a.y1-a.y0)*i/4;
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.font=lf;ctx.textAlign='left';
    ctx.fillText('$'+fmt(mx-(mx-mn)*i/4),a.x1+2,y+3);
  }

  try{
    const st=Math.max(0,candles.length-N);

    // 1. 구름대 (일목)
    if(show.cloud&&candles.length>=52){
      const ichi=calcIchimoku(candles);
      ctx.save();

      // ── 구름 채우기 (훨씬 진하게) ──────────────────────────
      for(let i=1;i<N;i++){
        const gi=st+i;if(gi>=ichi.length)break;
        const pv=ichi[gi-1],cv=ichi[gi];
        if(!pv.spanA||!pv.spanB||!cv.spanA||!cv.spanB)continue;
        const x0=i2x(i-1,N,a),x1=i2x(i,N,a);
        const pA=p2y(pv.spanA,mn,mx,a),pB=p2y(pv.spanB,mn,mx,a);
        const cA=p2y(cv.spanA,mn,mx,a),cB=p2y(cv.spanB,mn,mx,a);
        const isBull=pv.spanA>pv.spanB;
        // 기본 채우기 (진하게 .42 → 기존 .16)
        ctx.fillStyle=isBull?'rgba(38,166,154,.42)':'rgba(239,83,80,.38)';
        ctx.beginPath();ctx.moveTo(x0,pA);ctx.lineTo(x1,cA);ctx.lineTo(x1,cB);ctx.lineTo(x0,pB);ctx.closePath();ctx.fill();
      }

      // ── 선행스팬 A (초록 — 굵게) ────────────────────────────
      ctx.strokeStyle='rgba(38,220,170,.95)';ctx.lineWidth=2;ctx.setLineDash([]);
      ctx.beginPath();let fA=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.spanA)return;const y=p2y(ichi[gi].spanA,mn,mx,a),x=i2x(i,N,a);fA?(ctx.moveTo(x,y),fA=false):ctx.lineTo(x,y);});
      ctx.stroke();

      // ── 선행스팬 B (빨강 — 굵게) ────────────────────────────
      ctx.strokeStyle='rgba(255,90,90,.95)';ctx.lineWidth=2;
      ctx.beginPath();let fB=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.spanB)return;const y=p2y(ichi[gi].spanB,mn,mx,a),x=i2x(i,N,a);fB?(ctx.moveTo(x,y),fB=false):ctx.lineTo(x,y);});
      ctx.stroke();

      // ── 구름 위/아래 경계선 강조 (현재 위치 기준) ───────────
      const lastIchi=ichi[candles.length-1];
      if(lastIchi?.spanA&&lastIchi?.spanB){
        const lc=candles[candles.length-1].close;
        const top=Math.max(lastIchi.spanA,lastIchi.spanB);
        const bot=Math.min(lastIchi.spanA,lastIchi.spanB);
        const pos=lc>top?'above':lc<bot?'below':'inside';
        // 현재가 기준 가까운 경계선만 밝게 강조
        if(pos==='above'){
          // 구름 상단선 (지지선) 강조
          ctx.strokeStyle='rgba(38,220,170,1)';ctx.lineWidth=2.5;ctx.setLineDash([6,3]);
        }else if(pos==='below'){
          // 구름 하단선 (저항선) 강조
          ctx.strokeStyle='rgba(255,90,90,1)';ctx.lineWidth=2.5;ctx.setLineDash([6,3]);
        }else{
          ctx.strokeStyle='rgba(250,204,21,.8)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
        }
        const boundaryY=pos==='below'?p2y(bot,mn,mx,a):p2y(top,mn,mx,a);
        ctx.beginPath();ctx.moveTo(a.x0,boundaryY);ctx.lineTo(a.x1,boundaryY);ctx.stroke();
        ctx.setLineDash([]);
      }

      // ── 전환선 (밝은 파랑 — 굵게) ───────────────────────────
      ctx.strokeStyle='rgba(100,210,255,.9)';ctx.lineWidth=1.8;ctx.setLineDash([]);
      ctx.beginPath();let fT=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.tenkan)return;const y=p2y(ichi[gi].tenkan,mn,mx,a),x=i2x(i,N,a);fT?(ctx.moveTo(x,y),fT=false):ctx.lineTo(x,y);});
      ctx.stroke();

      // ── 기준선 (밝은 주황 — 굵게) ───────────────────────────
      ctx.strokeStyle='rgba(255,170,50,.9)';ctx.lineWidth=2;
      ctx.beginPath();let fK=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.kijun)return;const y=p2y(ichi[gi].kijun,mn,mx,a),x=i2x(i,N,a);fK?(ctx.moveTo(x,y),fK=false):ctx.lineTo(x,y);});
      ctx.stroke();ctx.setLineDash([]);
      // 구름 상태 배지 (더 선명하게)
      if(!mob()){
        const ic=ichi[candles.length-1];
        if(ic?.spanA&&ic?.spanB){
          const lc=candles[candles.length-1].close,top=Math.max(ic.spanA,ic.spanB),bot=Math.min(ic.spanA,ic.spanB);
          const pos=lc>top?'above':lc<bot?'below':'inside';
          const bullC=ic.spanA>ic.spanB;
          const txt=pos==='above'?(bullC?'☁⬆ 구름 위 (상승구름 — 강세)':'☁⬆ 구름 위 (하락구름 — 주의)'):
                    pos==='below'?(bullC?'☁⬇ 구름 아래 (상승구름 — 주의)':'☁⬇ 구름 아래 (하락구름 — 약세)'):
                    '☁ 구름 안 (방향 대기)';
          const bc=pos==='above'?'rgba(16,185,129,.9)':pos==='below'?'rgba(239,68,68,.9)':'rgba(250,204,21,.8)';
          ctx.fillStyle=bc;ctx.fillRect(a.x0+5,a.y0+5,198,17);
          ctx.fillStyle='#fff';ctx.font='bold 9px Courier New';ctx.textAlign='left';ctx.fillText(txt,a.x0+8,a.y0+17);

          // 구름 돌파 순간 — 차트에 화살표 마커
          const n2=candles.length;
          const ichi2=ichi;
          const prev=ichi2[n2-2];
          if(prev?.spanA&&prev?.spanB){
            const prevTop=Math.max(prev.spanA,prev.spanB),prevBot=Math.min(prev.spanA,prev.spanB);
            const prevLc=candles[n2-2]?.close||lc;
            const wasAbove=prevLc>prevTop,wasBelow=prevLc<prevBot;
            const nowAbove=lc>top,nowBelow=lc<bot;
            if(!wasAbove&&nowAbove||!wasBelow&&nowBelow){
              const cx=i2x(N-1,N,a),cy=p2y(lc,mn,mx,a);
              const breakUp=!wasAbove&&nowAbove;
              const bc2=breakUp?'#10b981':'#ef4444';
              // 발광 원
              ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);
              ctx.fillStyle=bc2+'33';ctx.fill();
              ctx.strokeStyle=bc2;ctx.lineWidth=2.5;ctx.stroke();
              // 화살표
              ctx.fillStyle=bc2;ctx.font='bold 16px sans-serif';ctx.textAlign='center';
              ctx.fillText(breakUp?'▲':'▼',cx,breakUp?cy-18:cy+24);
              // "돌파!" 텍스트
              ctx.fillStyle=bc2+'ee';ctx.fillRect(cx-28,breakUp?cy-42:cy+28,56,16);
              ctx.fillStyle='#fff';ctx.font='bold 9px Courier New';
              ctx.fillText(breakUp?'돌파!':'이탈!',cx,breakUp?cy-30:cy+40);
            }
          }
        }
      }
      ctx.restore();
    }

    // 2. EMA99
    if(show.ema99&&candles.length>=99){
      const closes=candles.map(c=>c.close);
      const e99=emaArr(closes,99);
      const lc=candles[candles.length-1].close,e99v=e99[candles.length-1];
      const above=lc>e99v,col99=above?'rgba(251,146,60,.95)':'rgba(248,113,113,.95)';
      ctx.strokeStyle=above?'rgba(251,146,60,.18)':'rgba(248,113,113,.18)';ctx.lineWidth=5;ctx.setLineDash([]);
      ctx.beginPath();let fg=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!e99[gi])return;const y=p2y(e99[gi],mn,mx,a),x=i2x(i,N,a);fg?(ctx.moveTo(x,y),fg=false):ctx.lineTo(x,y);});
      ctx.stroke();
      ctx.strokeStyle=col99;ctx.lineWidth=2;
      ctx.beginPath();let fm=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!e99[gi])return;const y=p2y(e99[gi],mn,mx,a),x=i2x(i,N,a);fm?(ctx.moveTo(x,y),fm=false):ctx.lineTo(x,y);});
      ctx.stroke();
      if(e99v){
        const y99=p2y(e99v,mn,mx,a);
        ctx.fillStyle=col99;ctx.fillRect(a.x1+1,y99-8,44,14);
        ctx.fillStyle='#fff';ctx.font='bold 9px Courier New';ctx.textAlign='left';ctx.fillText('EMA99',a.x1+3,y99+3);
        if(!mob()){
          const d=((lc-e99v)/e99v*100);
          ctx.fillStyle=col99;ctx.font='bold 8px Courier New';ctx.textAlign='right';
          ctx.fillText((d>=0?'+':'')+d.toFixed(2)+'%',a.x1-2,y99-1);
        }
      }
    }

    // 3. MA20/60 + 골크
    if(show.ma&&candles.length>=62){
      const closes=candles.map(c=>c.close);
      const ma20arr=closes.map((_,i)=>i>=19?closes.slice(i-19,i+1).reduce((a,b)=>a+b)/20:null);
      const ma60arr=closes.map((_,i)=>i>=59?closes.slice(i-59,i+1).reduce((a,b)=>a+b)/60:null);
      const n2=closes.length;
      const m20=ma20arr[n2-1],m60=ma60arr[n2-1];
      const m20p=ma20arr[n2-2],m60p=ma60arr[n2-2];
      // MA20
      ctx.strokeStyle='rgba(56,189,248,.9)';ctx.lineWidth=1.8;ctx.setLineDash([]);
      ctx.beginPath();let f20=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!ma20arr[gi])return;const y=p2y(ma20arr[gi],mn,mx,a),x=i2x(i,N,a);f20?(ctx.moveTo(x,y),f20=false):ctx.lineTo(x,y);});
      ctx.stroke();
      // MA60
      ctx.strokeStyle='rgba(168,85,247,.9)';ctx.lineWidth=1.8;
      ctx.beginPath();let f60=true;
      vis.forEach((_,i)=>{const gi=st+i;if(!ma60arr[gi])return;const y=p2y(ma60arr[gi],mn,mx,a),x=i2x(i,N,a);f60?(ctx.moveTo(x,y),f60=false):ctx.lineTo(x,y);});
      ctx.stroke();
      // MA 라벨
      if(!mob()&&m20){
        const y20=p2y(m20,mn,mx,a);
        ctx.fillStyle='rgba(56,189,248,.9)';ctx.fillRect(a.x1+1,y20-7,36,13);
        ctx.fillStyle='#000';ctx.font='bold 8px Courier New';ctx.textAlign='left';ctx.fillText('MA20',a.x1+2,y20+3);
        if(m60){
          const y60=p2y(m60,mn,mx,a);
          ctx.fillStyle='rgba(168,85,247,.9)';ctx.fillRect(a.x1+1,y60-7,36,13);
          ctx.fillStyle='#fff';ctx.font='bold 8px Courier New';ctx.fillText('MA60',a.x1+2,y60+3);
        }
      }
      // 골든/데드크로스 마커
      const gc=m20&&m60&&m20p&&m60p&&m20>m60&&m20p<=m60p;
      const dc=m20&&m60&&m20p&&m60p&&m20<m60&&m20p>=m60p;
      if((gc||dc)&&!mob()){
        const cx=i2x(N-1,N,a),cy=p2y(candles[n2-1].close,mn,mx,a);
        const cc=gc?'#fbbf24':'#f87171';
        ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fillStyle=cc+'22';ctx.fill();
        ctx.strokeStyle=cc;ctx.lineWidth=2;ctx.stroke();
        ctx.fillStyle=cc;ctx.font='bold 10px Courier New';ctx.textAlign='center';
        ctx.fillText(gc?'★GC':'✕DC',cx,gc?cy-16:cy+22);
        ctx.strokeStyle=cc+'44';ctx.lineWidth=1;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(cx,a.y0);ctx.lineTo(cx,a.y1);ctx.stroke();ctx.setLineDash([]);
      }
      // 배지
      if(!mob()&&m20&&m60){
        const isG=m20>m60;const bc=isG?'rgba(251,191,36,.18)':'rgba(248,113,113,.18)';
        const tc=isG?'#fbbf24':'#f87171';
        ctx.fillStyle=bc;ctx.fillRect(a.x0+5,a.y0+25,170,14);
        ctx.fillStyle=tc;ctx.font='bold 8px Courier New';ctx.textAlign='left';
        ctx.fillText(isG?'★ 골든크로스 (MA20>MA60)':'✕ 데드크로스 (MA20<MA60)',a.x0+8,a.y0+35);
      }
    }

    // 4. 추세선
    if(show.trend){
      aiLines.forEach(tl=>{
        const base=candles.length-N;
        const i0=tl.i0-base,i1=tl.i1-base;
        if(i0<0&&i1<0)return;
        const col=tl.type==='sup'?'rgba(100,220,150,.55)':'rgba(255,120,120,.55)';
        ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.setLineDash([5,4]);
        ctx.beginPath();
        const x0=i2x(Math.max(0,i0),N,a),x1=i2x(Math.min(N-1,i1),N,a);
        const slope=(tl.p1-tl.p0)/(tl.i1-tl.i0||1);
        const y0=p2y(tl.p0+slope*(Math.max(0,i0)-i0),mn,mx,a);
        const y1=p2y(tl.p1+slope*(Math.min(N-1,i1)-i1),mn,mx,a);
        ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.setLineDash([]);
      });
    }

    // 5. 피보나치
    if(show.fib&&aiFib){
      const range=aiFib.high-aiFib.low;
      const lc=vis[vis.length-1]?.close||0;
      FIB_R.forEach((r,i)=>{
        const p=aiFib.high-range*r,y=p2y(p,mn,mx,a);
        if(y<a.y0-5||y>a.y1+5)return;
        const isKey=r===0.618,near=Math.abs(p-lc)/lc<0.003;
        ctx.strokeStyle=FIB_C[i]+(near?'ff':'88');ctx.lineWidth=near?1.5:.7;
        ctx.setLineDash(near?[]:[3,3]);
        ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();
        ctx.setLineDash([]);
        if(!mob()){
          const lw=near?80:60,pad=isKey?6:0;
          ctx.fillStyle=FIB_C[i]+(near?'cc':'77');
          ctx.fillRect(a.x1+1,y-7,lw+pad,13);
          ctx.fillStyle='#fff';ctx.font=isKey?'bold 8px Courier New':'8px Courier New';
          ctx.textAlign='left';ctx.fillText(FIB_N[i],a.x1+3,y+3);
        }
      });
      // 고점/저점 마커
      const base=candles.length-N;
      const hiR=aiFib.hiI-base,loR=aiFib.loI-base;
      if(hiR>=0&&hiR<N){const x=i2x(hiR,N,a),y=p2y(aiFib.high,mn,mx,a);ctx.fillStyle='#ff6b6b';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillText('▼H',x,y-4);}
      if(loR>=0&&loR<N){const x=i2x(loR,N,a),y=p2y(aiFib.low,mn,mx,a);ctx.fillStyle='#63e6be';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillText('▲L',x,y+11);}
    }

    // 6. 거래량
    {
      let maxV=0;vis.forEach(c=>{if(c.vol>maxV)maxV=c.vol;});
      if(maxV>0){
        const vH=a.vY1-a.vY0;
        const avg20=vis.slice(-20).map(c=>c.vol).reduce((a,b)=>a+b,0)/Math.min(vis.length,20);
        ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(a.x0,a.vY0,a.x1-a.x0,vH);
        vis.forEach((c,i)=>{
          const x=i2x(i,N,a),vh=Math.max(1,(c.vol/maxV)*vH*.88);
          const isUp=c.close>=c.open,r=c.vol/avg20;
          ctx.fillStyle=r>=3?(isUp?'rgba(52,211,153,.9)':'rgba(248,113,113,.9)'):
            r>=2?(isUp?'rgba(74,222,128,.7)':'rgba(252,165,165,.7)'):
            (isUp?'rgba(38,166,154,.3)':'rgba(239,83,80,.27)');
          ctx.fillRect(x-cw/2,a.vY1-vh,cw,vh);
        });
        // 평균선
        const avgY=a.vY1-(avg20/maxV)*vH*.88;
        ctx.strokeStyle='rgba(250,204,21,.4)';ctx.lineWidth=.8;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(a.x0,avgY);ctx.lineTo(a.x1,avgY);ctx.stroke();ctx.setLineDash([]);
      }
    }
  }catch(e){console.warn('지표 오류:',e.message);}

  ctx.setLineDash([]);ctx.globalAlpha=1;

  // 7. 캔들 (항상 마지막)
  vis.forEach((c,i)=>{
    const x=i2x(i,N,a),bull=c.close>=c.open,col=bull?'#26a69a':'#ef5350';
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,p2y(c.high,mn,mx,a));ctx.lineTo(x,p2y(c.low,mn,mx,a));ctx.stroke();
    const oy=p2y(c.open,mn,mx,a),cy=p2y(c.close,mn,mx,a);
    const by=Math.min(oy,cy),bh=Math.max(1,Math.abs(cy-oy));
    ctx.fillStyle=col;ctx.fillRect(x-cw/2,by,cw,bh);
    if(cw>4){ctx.strokeStyle=col;ctx.strokeRect(x-cw/2,by,cw,bh);}
  });

  // 현재가 라인
  if(vis.length&&candles.length){
    const lc=candles[candles.length-1].close,y=p2y(lc,mn,mx,a);
    const bull=candles[candles.length-1].close>=candles[candles.length-1].open;
    ctx.strokeStyle=bull?'rgba(38,166,154,.6)':'rgba(239,83,80,.6)';
    ctx.lineWidth=.8;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=bull?'rgba(38,166,154,.9)':'rgba(239,83,80,.9)';
    ctx.fillRect(a.x1+1,y-7,74,14);
    ctx.fillStyle='#fff';ctx.font='bold 9px Courier New';ctx.textAlign='left';
    ctx.fillText('▶ $'+fmt(lc),a.x1+3,y+3);
  }

  // ── 시간축 (X축) ──────────────────────────────────────────
  if(vis.length>=2){
    const timeY=a.vY1+8; // 거래량 바 아래
    ctx.font='8px Courier New';
    // 타임프레임에 따른 포맷
    const fmtTime=(t)=>{
      const d=new Date(t);
      if(tf==='1d') return `${d.getMonth()+1}/${d.getDate()}`;
      if(tf==='4h'||tf==='1h')
        return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}h`;
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };
    // 몇 개씩 건너뛸지 (화면 너비에 따라)
    const labelW=mob()?52:62;
    const step=Math.max(1,Math.ceil(N*labelW/(a.x1-a.x0)));
    let prevLabelX=-999;
    vis.forEach((c,i)=>{
      if(i%step!==0)return;
      const x=i2x(i,N,a);
      if(x-prevLabelX<labelW)return;
      prevLabelX=x;
      const label=fmtTime(c.time);
      // 눈금선
      ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=.5;
      ctx.beginPath();ctx.moveTo(x,a.y1);ctx.lineTo(x,a.vY1+2);ctx.stroke();
      // 라벨
      ctx.fillStyle='#94a3b8';ctx.textAlign='center';
      ctx.fillText(label,x,timeY);
    });
    // 현재 시간 강조
    if(candles.length){
      const cx=i2x(N-1,N,a);
      const nowLabel=fmtTime(candles[candles.length-1].time);
      ctx.fillStyle='rgba(56,139,253,.9)';
      ctx.fillRect(cx-22,timeY-9,44,12);
      ctx.fillStyle='#fff';ctx.font='bold 8px Courier New';ctx.textAlign='center';
      ctx.fillText(nowLabel,cx,timeY);
    }
  }
}

async function fetchJSON(url,timeout=10000,method='GET',body=null){
  const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const opts={signal:ctrl.signal,cache:'no-store',method};
    if(body){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body);}
    const r=await fetch(url,opts);clearTimeout(t);return r.json();
  }catch(e){clearTimeout(t);throw e;}
}

async function fetchHLCandles(sym,interval,limit=300){
  // HL 캔들 interval 변환 (1m→1, 5m→5, 1h→60, 4h→240, 1d→1440)
  const imap={'1m':1,'5m':5,'15m':15,'1h':60,'4h':240,'1d':1440};
  const hi=imap[interval]||1;
  const now=Date.now();
  const startTime=now-hi*60*1000*limit;
  const d=await fetchJSON(HLAPI,12000,'POST',{
    type:'candleSnapshot',
    req:{coin:sym,interval:`${hi}m`,startTime,endTime:now}
  });
  if(!Array.isArray(d))throw new Error('HL 캔들 오류');
  return d.map(k=>({
    time:+k.t,open:+k.o,high:+k.h,low:+k.l,close:+k.c,vol:+k.v
  })).filter(c=>c.open>0&&c.close>0);
}

async function fetchHLPrice(sym){
  const d=await fetchJSON(HLAPI,5000,'POST',{type:'allMids'});
  return +(d[sym]||0);
}

// ── MTF 위젯 드래그 ───────────────────────────────────────
(function(){
  const w=document.getElementById('mtf-widget');
  const h=document.getElementById('mtf-handle');
  if(!w||!h)return;
  let isDrag=false,startX=0,startY=0,origX=0,origY=0;

  function getPos(){
    const r=w.getBoundingClientRect();
    return{x:r.left,y:r.top};
  }
  function applyPos(x,y){
    const maxX=window.innerWidth-w.offsetWidth;
    const maxY=window.innerHeight-w.offsetHeight;
    x=Math.max(0,Math.min(maxX,x));
    y=Math.max(0,Math.min(maxY,y));
    w.style.left=x+'px';w.style.top=y+'px';
    w.style.right='auto';w.style.bottom='auto';
  }

  // 마우스
  h.addEventListener('mousedown',e=>{
    if(e.target===document.getElementById('mtf-minimize'))return;
    isDrag=true;const p=getPos();
    startX=e.clientX;startY=e.clientY;origX=p.x;origY=p.y;
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!isDrag)return;
    applyPos(origX+(e.clientX-startX),origY+(e.clientY-startY));
  });
  document.addEventListener('mouseup',()=>isDrag=false);

  // 터치
  h.addEventListener('touchstart',e=>{
    if(e.target===document.getElementById('mtf-minimize'))return;
    isDrag=true;const p=getPos();
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    origX=p.x;origY=p.y;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!isDrag)return;
    applyPos(origX+(e.touches[0].clientX-startX),origY+(e.touches[0].clientY-startY));
  },{passive:true});
  document.addEventListener('touchend',()=>isDrag=false);
})();

// ── WebSocket (Binance) ───────────────────────────────────
function connectWS(){
  if(ws){try{ws.close();}catch(e){}}
  if(currentExch==='hyperliquid'){setBadge('REST','rgba(56,189,248,.15)','#38bdf8');return;}
  const url=`wss://fstream.binance.com/stream?streams=${currentSym.toLowerCase()}@aggTrade/${currentSym.toLowerCase()}@kline_${tf}`;
  try{
    ws=new WebSocket(url);
    ws.onopen=()=>{wsAlive=true;setBadge('WS','rgba(74,222,128,.2)','#4ade80');};
    ws.onclose=()=>{wsAlive=false;setBadge('REST','rgba(239,68,68,.15)','#f87171');setTimeout(()=>{if(currentExch==='binance')connectWS();},3000);};
    ws.onerror=()=>ws.close();
    ws.onmessage=e=>{
      const d=JSON.parse(e.data);if(!d.data)return;
      const s=d.data;
      if(s.e==='aggTrade'){
        const p=+s.p;if(p<=0)return;
        updatePrice(p,0,0,0,0);
        if(candles.length){const c=candles[candles.length-1];if(p>c.high)c.high=p;if(p<c.low)c.low=p;c.close=p;}
        scheduleDraw();
      }else if(s.e==='kline'){
        const k=s.k;
        const nc={time:+k.t,open:+k.o,high:+k.h,low:+k.l,close:+k.c,vol:+k.v};
        if(!nc.open||!nc.close)return;
        const last=candles[candles.length-1];
        if(last&&last.time===nc.time){last.high=Math.max(last.high,nc.high);last.low=Math.min(last.low,nc.low);last.close=nc.close;last.vol=nc.vol;}
        else if(!last||nc.time>last.time){
          candles.push(nc);if(candles.length>800)candles.shift();scheduleAI();
          // 현재 TF가 5m/15m면 실시간 구름 감지
          if(tf==='5m'||tf==='15m') checkCloudBreak(tf,candles);
        }
        scheduleDraw();
      }
    };
  }catch(e){setBadge('REST','rgba(239,68,68,.15)','#f87171');}
}

let _openP=0;
function updatePrice(price,high,low,vol,op){
  if(price<=0)return;
  if(op>0)_openP=op;
  const el=document.getElementById('price');if(el)el.textContent='$'+fmt(price);
  const chEl=document.getElementById('chg');
  if(chEl&&_openP>0){
    const ch=((price-_openP)/_openP*100).toFixed(2);
    const up=+ch>=0;
    chEl.textContent=(up?'+':'')+ch+'%';
    chEl.style.background=up?'rgba(38,166,154,.2)':'rgba(239,68,68,.15)';
    chEl.style.color=up?'#4ade80':'#f87171';
  }
}

let dragX=null,_offset=0;
mc.addEventListener('mousedown',e=>{dragX=e.clientX;});
mc.addEventListener('mousemove',e=>{
  if(dragX===null)return;
  const dx=e.clientX-dragX;dragX=e.clientX;
  const bw=mob()?8:6,move=Math.round(dx/bw);
  if(move!==0){_offset=Math.max(0,Math.min(candles.length-10,_offset+move));scheduleDraw();}
});
mc.addEventListener('mouseup',()=>dragX=null);
mc.addEventListener('mouseleave',()=>dragX=null);
mc.addEventListener('touchstart',e=>{dragX=e.touches[0].clientX;},{passive:true});
mc.addEventListener('touchmove',e=>{
  if(dragX===null)return;
  const dx=e.touches[0].clientX-dragX;dragX=e.touches[0].clientX;
  const bw=8,move=Math.round(dx/bw);
  if(move!==0){_offset=Math.max(0,Math.min(candles.length-10,_offset+move));scheduleDraw();}

// ── 뉴스 시스템 ───────────────────────────────────────────
let newsItems=[];
let newsTimer=null;

// 키워드 → 색상/아이콘 분류
const NEWS_KEYWORDS={
  bull:[
    {w:['ETF','승인','승인되','매수','보유','적립','최고가','돌파','상승','랠리','급등'],col:'#34d399',icon:'📈'},
    {w:['MicroStrategy','BlackRock','Fidelity','기관','펀드','투자'],col:'#34d399',icon:'🏦'},
  ],
  bear:[
    {w:['매도','하락','급락','규제','금지','해킹','사기','폰지','붕괴','위기'],col:'#f87171',icon:'📉'},
    {w:['SEC','소송','조사','압류','벌금','청산'],col:'#f87171',icon:'⚖️'},
  ],
  neutral:[
    {w:['연준','금리','CPI','경제','GDP','달러'],col:'#fbbf24',icon:'🏛️'},
    {w:['업데이트','하드포크','개발','출시'],col:'#a78bfa',icon:'🔧'},
  ],
};

function classifyNews(title){
  const t=title.toLowerCase();
  for(const {w,col,icon} of NEWS_KEYWORDS.bull) if(w.some(k=>t.includes(k.toLowerCase()))) return{col,icon,type:'bull'};
  for(const {w,col,icon} of NEWS_KEYWORDS.bear) if(w.some(k=>t.includes(k.toLowerCase()))) return{col,icon,type:'bear'};
  for(const {w,col,icon} of NEWS_KEYWORDS.neutral) if(w.some(k=>t.includes(k.toLowerCase()))) return{col,icon,type:'neutral'};
  return{col:'#c9d1d9',icon:'📌',type:'neutral'};
}

function timeAgo(ts){
  const m=Math.floor((Date.now()-ts*1000)/60000);
  if(m<1) return '방금';if(m<60) return `${m}분 전`;
  const h=Math.floor(m/60);if(h<24) return `${h}시간 전`;
  return `${Math.floor(h/24)}일 전`;
}

async function loadNews(){
  // CryptoCompare 무료 뉴스 API (API key 불필요)
  const sources=[
    {
      url:'https://min-api.cryptocompare.com/data/v2/news/?lang=EN&categories=BTC,Crypto&sortOrder=latest&limit=30',
      parse:(d)=>d.Data?.map(n=>({title:n.title,url:n.url,ts:n.published_on,src:n.source_info?.name||n.source}))
    },
    {
      // 백업: CoinDesk RSS via allorigins CORS proxy
      url:'https://api.allorigins.win/get?url='+encodeURIComponent('https://www.coindesk.com/arc/outboundfeeds/rss/'),
      parse:(d)=>{
        const txt=d.contents||'';
        const items=[...txt.matchAll(/<item>[\s\S]*?<title><!\[CDATA\[(.*?)\]\]><\/title>[\s\S]*?<link>(.*?)<\/link>[\s\S]*?<pubDate>(.*?)<\/pubDate>[\s\S]*?<\/item>/g)];
        return items.slice(0,20).map(m=>({title:m[1],url:m[2],ts:Math.floor(new Date(m[3]).getTime()/1000),src:'CoinDesk'}));
      }
    }
  ];

  for(const src of sources){
    try{
      const d=await fetchJSON(src.url,8000);
      const items=src.parse(d);
      if(items?.length>=3){
        newsItems=items.filter(n=>n.title).slice(0,25);
        renderNews();
        return;
      }
    }catch(e){}
  }
  // 둘 다 실패시 더미 뉴스
  useFallbackNews();
}

function useFallbackNews(){
  newsItems=[
    {title:'BTC 시장 분석: 주요 지지선 테스트 중',url:'#',ts:Math.floor(Date.now()/1000)-300,src:'분석'},
    {title:'암호화폐 거래량 전일 대비 15% 증가',url:'#',ts:Math.floor(Date.now()/1000)-600,src:'시장'},
    {title:'기관 투자자 BTC 포지션 유지 중',url:'#',ts:Math.floor(Date.now()/1000)-900,src:'뉴스'},
  ];
  renderNews();
}

function renderNews(){
  if(!newsItems.length) return;
  const track=document.getElementById('news-track');
  if(!track) return;

  const makeItem=(n)=>{
    const cls=classifyNews(n.title);
    const ago=timeAgo(n.ts);
    return `<div class="news-item ${cls.type==='bull'?'news-bull':cls.type==='bear'?'news-bear':''}"
      onclick="window.open('${n.url}','_blank')" title="${n.title}">
      <span class="news-dot" style="background:${cls.col}"></span>
      <span style="color:${cls.col}">${cls.icon}</span>
      <span>${n.title.length>70?n.title.slice(0,70)+'…':n.title}</span>
      <span class="news-time">${n.src||''} · ${ago}</span>
    </div>`;
  };

  // 두 번 반복 (무한 스크롤 효과)
  const html=newsItems.map(makeItem).join('');
  track.innerHTML=html+html;

  // 뉴스 개수에 따라 속도 조절
  const totalChars=newsItems.reduce((s,n)=>s+n.title.length,0);
  const speed=Math.max(40,Math.min(120,totalChars/8));
  track.style.animation=`newsScroll ${speed}s linear infinite`;
}

function startNewsTimer(){
  loadNews();
  if(newsTimer) clearInterval(newsTimer);
  newsTimer=setInterval(loadNews,5*60*1000); // 5분마다 갱신
}

loadCoinList();
loadCandles();
startNewsTimer();
