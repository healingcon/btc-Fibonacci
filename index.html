<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<!-- ★ PWA 필수 태그 ★ -->
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC Chart">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<title>BTC Futures — AI Signal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{background:#0d1117;color:#e6edf3;font-family:'Courier New',monospace;font-size:13px}
#app{width:100%;max-width:1600px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:7px}

/* HEADER */
#hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#161b22;border:1px solid #30363d;border-radius:8px;flex-wrap:wrap}
.sym{font-size:11px;font-weight:500;color:#8b949e;white-space:nowrap}
#pbig{font-size:24px;font-weight:500;letter-spacing:-1px;white-space:nowrap}
.chg{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.up{color:#3fb950;background:rgba(63,185,80,.13);border:1px solid rgba(63,185,80,.3)}
.dn{color:#f85149;background:rgba(248,81,73,.13);border:1px solid rgba(248,81,73,.3)}
.neu{color:#8b949e;background:#21262d;border:1px solid #30363d}
#src-badge{font-size:9px;padding:1px 7px;border-radius:3px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
#tf-row,#ctrl-row{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none}
#tf-row::-webkit-scrollbar,#ctrl-row::-webkit-scrollbar{display:none}
.btn{font-size:11px;padding:5px 10px;border:1px solid #30363d;border-radius:5px;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Courier New',monospace;white-space:nowrap;flex-shrink:0;min-height:32px;transition:background .1s}
.btn:active{background:#30363d}
.btn.on{background:#1c2d3f;color:#58a6ff;border-color:#388bfd}
#btnAI{border-color:rgba(80,200,80,.35)!important;color:#3fb950!important}
#btnAlert.on{border-color:rgba(255,200,0,.4)!important;color:#e3b341!important}

/* SIGNAL PANEL */
#sigpanel{display:grid;grid-template-columns:160px 1fr;gap:7px}
@media(max-width:600px){#sigpanel{grid-template-columns:1fr}}
#sig-main{background:#0d1117;border:1px solid #30363d;border-radius:8px;display:flex;flex-direction:row;align-items:center;justify-content:space-around;padding:12px;gap:10px;flex-wrap:wrap}
@media(min-width:601px){#sig-main{flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:10px}}
#sig-ring{position:relative;width:110px;height:110px;flex-shrink:0}
@media(min-width:601px){#sig-ring{width:130px;height:130px}}
#sig-ring svg{width:100%;height:100%}
#sig-ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#sig-dir{font-size:17px;font-weight:500;line-height:1.1}
#sig-pct{font-size:11px;color:#8b949e;margin-top:1px}
#sig-right-mini{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
@media(min-width:601px){#sig-right-mini{display:none}}
#sig-verdict{font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;text-align:center;width:100%}
.sv-buy{background:rgba(63,185,80,.12);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.sv-sell{background:rgba(248,81,73,.12);color:#f85149;border:1px solid rgba(248,81,73,.3)}
.sv-neu{background:#21262d;color:#8b949e;border:1px solid #30363d}
#sig-summary{font-size:10px;color:#8b949e;text-align:center;line-height:1.5;width:100%}
#sig-right{display:flex;flex-direction:column;gap:6px}
#sig-indicators{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ind-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px}
.ind-name{font-size:9px;color:#484f58;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.ind-val{font-size:14px;font-weight:500}
.ind-bar{height:3px;border-radius:2px;background:#21262d;margin-top:5px;overflow:hidden}
.ind-fill{height:100%;border-radius:2px;transition:width .4s}
.ind-desc{font-size:9px;margin-top:2px}
#sig-signals{display:flex;flex-direction:column;gap:3px;max-height:140px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#30363d transparent}
#sig-signals::-webkit-scrollbar{width:3px}
#sig-signals::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.sig-row{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#161b22;border:1px solid #21262d;border-radius:4px}
.sig-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sig-name{font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig-val{font-size:9px;color:#484f58;padding:1px 5px;border-radius:3px;background:#21262d;flex-shrink:0}
.sig-cat{font-size:8px;padding:1px 4px;border-radius:3px;color:#484f58;background:#0d1117;flex-shrink:0}

/* AI PANEL */
#aip{display:flex;gap:6px;padding:6px 12px;background:#161b22;border:1px solid #30363d;border-radius:8px;flex-wrap:wrap;align-items:center;overflow-x:auto}
.albl{font-size:9px;color:#484f58;text-transform:uppercase;letter-spacing:.4px;font-weight:600;white-space:nowrap}
.abadge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0}
.a-up{background:rgba(63,185,80,.1);color:#3fb950;border:1px solid rgba(63,185,80,.25)}
.a-dn{background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.25)}
.a-neu{background:#21262d;color:#8b949e;border:1px solid #30363d}
.a-info{background:rgba(88,166,255,.08);color:#79c0ff;border:1px solid rgba(88,166,255,.22)}
.a-warn{background:rgba(210,153,34,.1);color:#e3b341;border:1px solid rgba(210,153,34,.25)}
.a-ch{background:rgba(151,117,250,.1);color:#bc8cff;border:1px solid rgba(151,117,250,.25)}

/* CHART */
#cw{position:relative;background:#0d1117;border:1px solid #30363d;border-radius:8px;overflow:hidden}
#leg{display:flex;gap:8px;padding:5px 12px;font-size:10px;color:#8b949e;border-bottom:1px solid #1c2128;flex-wrap:wrap;overflow-x:auto;scrollbar-width:none}
#leg::-webkit-scrollbar{display:none}
.li{display:flex;align-items:center;gap:3px;white-space:nowrap}
.lc{width:14px;height:2px;display:inline-block;flex-shrink:0}
canvas{display:block;width:100%;touch-action:none}
#oc{position:absolute;top:0;left:0;width:100%;pointer-events:none}
#tip{position:absolute;display:none;font-size:10px;background:#1c2128;border:1px solid #30363d;padding:4px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;z-index:20}
#spin-wrap{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(13,17,23,.85);z-index:30;border-radius:8px;flex-direction:column;gap:10px}
.spinner{width:28px;height:28px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:sp .7s linear infinite}
#spin-msg{font-size:11px;color:#8b949e}
@keyframes sp{to{transform:rotate(360deg)}}

/* FIB BAR */
#fibbar{display:none;padding:6px 12px;background:#0d1117;border-top:1px solid #21262d;flex-wrap:wrap;gap:4px;align-items:center;overflow-x:auto}
.fb{padding:2px 6px;border-radius:3px;font-size:10px;font-weight:500;white-space:nowrap}

/* STATUS */
#sbar{display:flex;gap:10px;padding:6px 12px;background:#161b22;border:1px solid #30363d;border-radius:8px;font-size:10px;color:#8b949e;flex-wrap:wrap;align-items:center;overflow-x:auto;scrollbar-width:none}
#sbar::-webkit-scrollbar{display:none}
.coin-btn{font-size:11px;padding:4px 9px;border:1px solid #30363d;border-radius:5px;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Courier New',monospace;white-space:nowrap;flex-shrink:0;min-height:28px;transition:all .15s;}
.coin-btn:active{transform:scale(.95)}
.coin-btn.on{background:#1c2d3f;color:#58a6ff;border-color:#388bfd;font-weight:600}
.coin-btn:hover{border-color:#58a6ff;color:#79c0ff}
#coin-dropdown::-webkit-scrollbar{width:3px}
#coin-dropdown::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
.coin-dd-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;transition:background .1s;border-bottom:1px solid #21262d;gap:8px}
.coin-dd-item:hover{background:#21262d}
.coin-dd-item:last-child{border-bottom:none}
.coin-dd-sym{font-family:'Courier New',monospace;font-size:12px;font-weight:600;color:#e6edf3}
.coin-dd-name{font-size:10px;color:#8b949e}
.coin-dd-price{font-family:'Courier New',monospace;font-size:11px;color:#58a6ff;text-align:right}
.ex-tab{font-size:11px;padding:4px 12px;border:1px solid #30363d;border-radius:5px;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Courier New',monospace;white-space:nowrap;transition:all .15s;font-weight:600;}
.ex-tab.on{background:#0d2137;color:#58a6ff;border-color:#388bfd;}
.ex-tab:hover{border-color:#58a6ff}
.hl-btn.on{background:#001a2e;color:#00c2ff;border-color:#00c2ff;}
.coin-row-wrap{display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto;scrollbar-width:none;width:100%}
.coin-row-wrap::-webkit-scrollbar{display:none}
#coin-row::-webkit-scrollbar{display:none}
#coin-panel-list div:hover{background:rgba(255,255,255,.06)!important;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes crossFlash{0%{opacity:1}100%{opacity:0}}
@keyframes crossFadeIn{from{opacity:0}to{opacity:1}}
@keyframes crossPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes crossBounce{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes crossCountdown{from{width:100%}to{width:0%}}
@keyframes crossSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes gcPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}70%{box-shadow:0 0 0 12px rgba(251,191,36,0)}}
@keyframes dcPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}70%{box-shadow:0 0 0 12px rgba(248,113,113,0)}}
.live{color:#3fb950!important}
.live-dot{background:#26a69a}
.rest-dot{background:#e3b341}
.dead-dot{background:#f85149}
</style>
</head>
<body>
<div id="app">

<div id="hdr">
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <div class="sym" id="sym-label">BTCUSDT PERP</div>
    <span id="src-badge" style="background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.3)">연결 중...</span>
  </div>
  <div id="pbig">--</div>
  <div id="pch" class="chg neu">--</div>

  <!-- 거래소 탭 -->
  <div style="display:flex;gap:4px;align-items:center">
    <button id="ex-binance" class="ex-tab on" onclick="switchExchange('binance')">
      <span style="color:#f0b90b">◆</span> Binance
    </button>
    <button id="ex-hl" class="ex-tab" onclick="switchExchange('hyperliquid')">
      <span style="color:#00c2ff">⬡</span> Hyperliquid
    </button>
  </div>

  <!-- 코인 선택 버튼 -->
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <button id="coin-picker-btn" onclick="toggleCoinPanel()" style="
      display:flex;align-items:center;gap:8px;
      background:#21262d;border:1px solid #388bfd;border-radius:8px;
      color:#e6edf3;font-family:'Courier New',monospace;font-size:13px;
      padding:6px 14px;cursor:pointer;min-width:150px;justify-content:space-between;
      transition:all .15s;">
      <span id="coin-picker-label">₿ BTC</span>
      <span style="color:#58a6ff;font-size:11px">▼ 변경</span>
    </button>
    <!-- 직접 입력 -->
    <input id="coin-search" type="text" placeholder="직접 입력..." autocomplete="off" autocorrect="off" autocapitalize="off"
      style="background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3;
             font-family:'Courier New',monospace;font-size:12px;padding:6px 10px;
             width:110px;outline:none;transition:border .15s"
      onfocus="this.style.borderColor='#388bfd'"
      onblur="this.style.borderColor='#30363d'"
      oninput="filterCoins(this.value)"
      onkeydown="handleCoinSearchKey(event)">
  </div>

  <!-- 코인 선택 모달 패널 -->
  <div id="coin-panel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:8888;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)" onclick="closeCoinPanel(event)">
    <div style="position:absolute;bottom:0;left:0;right:0;background:#161b22;border-radius:16px 16px 0 0;
      border-top:1px solid #30363d;max-height:75vh;display:flex;flex-direction:column;
      box-shadow:0 -8px 40px rgba(0,0,0,.8)" onclick="event.stopPropagation()">

      <!-- 패널 헤더 -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex-shrink:0">
        <div style="font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:#e6edf3">코인 선택</div>
        <div style="display:flex;gap:6px">
          <button id="panel-ex-binance" class="ex-tab on" onclick="switchExchangePanel('binance')">◆ Binance</button>
          <button id="panel-ex-hl" class="ex-tab" onclick="switchExchangePanel('hyperliquid')">⬡ HL</button>
        </div>
        <button onclick="hideCoinPanel()" style="background:none;border:none;color:#8b949e;font-size:20px;cursor:pointer;padding:0 4px;line-height:1">✕</button>
      </div>

      <!-- 검색바 -->
      <div style="padding:0 16px 10px;flex-shrink:0">
        <div style="position:relative">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#484f58">🔍</span>
          <input id="panel-search" type="text" placeholder="코인 검색..." autocomplete="off"
            style="width:100%;background:#21262d;border:1px solid #30363d;border-radius:8px;
                   color:#e6edf3;font-family:'Courier New',monospace;font-size:13px;
                   padding:8px 10px 8px 32px;outline:none;box-sizing:border-box;transition:border .15s"
            onfocus="this.style.borderColor='#388bfd'"
            onblur="this.style.borderColor='#30363d'"
            oninput="filterPanelCoins(this.value)">
        </div>
      </div>

      <!-- 코인 목록 -->
      <div id="coin-panel-list" style="overflow-y:auto;flex:1;padding:0 8px 20px"></div>
    </div>
  </div>

  <div id="tf-row">
    <button class="btn on" data-tf="1m">1m</button>
    <button class="btn" data-tf="5m">5m</button>
    <button class="btn" data-tf="15m">15m</button>
    <button class="btn" data-tf="1h">1h</button>
    <button class="btn" data-tf="4h">4h</button>
    <button class="btn" data-tf="1d">1d</button>
  </div>
  <div id="ctrl-row">
    <button class="btn on" id="btnFib">Fib</button>
    <button class="btn on" id="btnMA">MA</button>
    <button class="btn on" id="btnIchimoku">☁ 구름대</button>
    <button class="btn on" id="btnGolden">★ 골크</button>
    <button class="btn on" id="btnPv">Pivot</button>
    <button class="btn on" id="btnHz">수평선</button>
    <button class="btn on" id="btnCh">채널</button>
    <button class="btn" id="btnAI">⟳ AI 재분석</button>
    <button class="btn on" id="btnAlert">🔔 알림</button>
  </div>
</div>

<div id="sigpanel">
  <div id="sig-main">
    <div id="sig-ring">
      <svg viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="54" fill="none" stroke="#21262d" stroke-width="10"/>
        <circle id="ring-arc" cx="70" cy="70" r="54" fill="none" stroke="#8b949e" stroke-width="10"
          stroke-dasharray="339.3" stroke-dashoffset="339.3"
          stroke-linecap="round" transform="rotate(-90 70 70)" style="transition:all .6s ease"/>
      </svg>
      <div id="sig-ring-label">
        <div id="sig-dir" style="color:#8b949e">--</div>
        <div id="sig-pct">0%</div>
      </div>
    </div>
    <div id="sig-right-mini">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:9px;color:#484f58;text-transform:uppercase">RSI</div>
        <div id="mini-rsi" style="font-size:13px;font-weight:500;color:#8b949e">--</div>
        <div id="mini-rsi-d" style="font-size:9px;color:#484f58">--</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:9px;color:#484f58;text-transform:uppercase">MACD</div>
        <div id="mini-macd" style="font-size:13px;font-weight:500;color:#8b949e">--</div>
        <div id="mini-macd-d" style="font-size:9px;color:#484f58">--</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:9px;color:#484f58;text-transform:uppercase">BB%</div>
        <div id="mini-bb" style="font-size:13px;font-weight:500;color:#8b949e">--</div>
        <div id="mini-bb-d" style="font-size:9px;color:#484f58">--</div>
      </div>
    </div>
    <div id="sig-verdict" class="sv-neu">분석 중...</div>
    <div id="sig-summary"></div>
  </div>
  <div id="sig-right">
    <div id="sig-indicators">
      <div class="ind-card">
        <div class="ind-name">RSI (14)</div>
        <div class="ind-val" id="ind-rsi" style="color:#8b949e">--</div>
        <div class="ind-bar"><div class="ind-fill" id="rsi-fill" style="width:50%;background:#8b949e"></div></div>
        <div class="ind-desc" id="rsi-desc" style="color:#484f58">--</div>
      </div>
      <div class="ind-card">
        <div class="ind-name">MACD</div>
        <div class="ind-val" id="ind-macd" style="color:#8b949e">--</div>
        <div class="ind-bar"><div class="ind-fill" id="macd-fill" style="width:50%;background:#8b949e"></div></div>
        <div class="ind-desc" id="macd-desc" style="color:#484f58">--</div>
      </div>
      <div class="ind-card">
        <div class="ind-name">볼린저밴드</div>
        <div class="ind-val" id="ind-bb" style="color:#8b949e">--</div>
        <div class="ind-bar"><div class="ind-fill" id="bb-fill" style="width:50%;background:#8b949e"></div></div>
        <div class="ind-desc" id="bb-desc" style="color:#484f58">--</div>
      </div>
    </div>
    <div id="sig-signals">
      <div style="font-size:9px;color:#484f58;padding:2px 4px;text-transform:uppercase;letter-spacing:.4px">활성 신호</div>
    </div>
  </div>
</div>

<div id="cw">
  <div id="leg">
    <div class="li"><span class="lc" style="background:#26a69a"></span>상승</div>
    <div class="li"><span class="lc" style="background:#ef5350"></span>하락</div>
    <div class="li"><span class="lc" style="background:#3fb950"></span>지지선</div>
    <div class="li"><span class="lc" style="background:#f85149"></span>저항선</div>
    <div class="li"><span class="lc" style="background:#bc8cff"></span>채널</div>
    <div class="li"><span class="lc" style="border-top:1px dashed #e3b341"></span>MA</div>
    <div class="li"><span class="lc" style="border-top:1px dashed #9775fa"></span>Fib</div>
    <div class="li"><span class="lc" style="border-top:1px solid #388bfd;opacity:.5"></span>수평</div>
  </div>
  <canvas id="mc"></canvas>
  <canvas id="oc"></canvas>
  <div id="tip"></div>
  <div id="spin-wrap"><div class="spinner"></div><div id="spin-msg">연결 중...</div></div>
</div>

<!-- OI 패널 -->
<div id="oi-wrap" style="position:relative;background:#0d1117;border-top:1px solid #21262d;height:90px;flex-shrink:0">
  <canvas id="oic" style="position:absolute;top:0;left:0;width:100%;height:100%"></canvas>
  <div id="oi-label" style="position:absolute;top:4px;left:8px;font-family:'Courier New',monospace;font-size:9px;color:#484f58;pointer-events:none;z-index:2">
    OI <span id="oi-val" style="color:#58a6ff">--</span>
    <span id="oi-chg" style="margin-left:6px"></span>
  </div>

<script>
/* ═══════ CONFIG ═══════ */
const isMob=()=>window.innerWidth<=600;
function CH(){return isMob()?340:500;}
const VOLH=60,FIB_R=[0,.236,.382,.5,.618,.786,1];
const FIB_C=['#9e9e9e','#29b6f6','#26a69a','#f0b90b','#ff7043','#ef5350','#b71c1c'];
const FIB_L=['0% 고점','23.6% 얕은조정','38.2% 1차지지','50% 중간선','61.8% 핵심지지','78.6% 마지노선','100% 저점'];
const FIB_L_SHORT=['고점','23.6%','38.2%','50%','⭐61.8%','78.6%','저점'];
const FIB_DESC=['추세 시작점 / 전고점 저항','강한 상승장에서의 얕은 조정','일반적인 조정 마무리 구간','심리적 중간선 (50:50)','황금비율 — 가장 중요한 지지','마지막 방어선 (이탈시 추세전환)','되돌림 완전 소멸 / 저점'];
const FAPI='https://fapi.binance.com/fapi/v1';

let candles=[],tf='1m',openPrice=0,currentSym='BTCUSDT';

/* ═══════ OI 데이터 ═══════ */
let oiHistory = [];   // [{t, oi}]
let oiPollId = null;
const OIC = document.getElementById('oic');
const oiCtx = OIC.getContext('2d');

function resizeOI(){
  const dpr = window.devicePixelRatio||1;
  const W = OIC.parentElement.clientWidth;
  const H = OIC.parentElement.clientHeight;
  OIC.width = W*dpr; OIC.height = H*dpr;
  OIC.style.width = W+'px'; OIC.style.height = H+'px';
  oiCtx.scale(dpr,dpr);
}
window.addEventListener('resize',()=>{ resizeOI(); drawOI(); });
setTimeout(resizeOI, 100);
let showFib=true,showMA=true,showPv=true,showHz=true,showCh=true,showIchimoku=true,showGolden=true;
let aiLines=[],aiFib=null,aiPivots=[],aiChannels=[],aiHzones=[];
let lastDirection=null,alertEnabled=true;
let audioCtx=null;
// 골든/데드크로스 상태 추적
let lastCrossState=null; // 'golden' | 'dead' | null
let crossAlertCooldown=0;

// 연결 상태 관리
let ws=null,wsAlive=false;
let pricePollId=null,candlePollId=null,ticker24Id=null;

const mc=document.getElementById('mc');
const oc=document.getElementById('oc');
const ctx=mc.getContext('2d');
const oct=oc.getContext('2d');

function resize(){
  const W=mc.parentElement.clientWidth,H=CH(),dpr=window.devicePixelRatio||1;
  mc.width=oc.width=W*dpr;mc.height=oc.height=H*dpr;
  mc.style.width=oc.style.width=W+'px';
  mc.style.height=oc.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  oct.setTransform(dpr,0,0,dpr,0,0);
}
function area(){
  const W=mc.clientWidth,H=CH(),pr=isMob()?70:90;
  return{x0:8,y0:16,x1:W-pr,y1:H-VOLH-26,vY0:H-VOLH,vY1:H-26,W};
}
function getVis(){
  const a=area(),bw=isMob()?9:7;
  return candles.slice(Math.max(0,candles.length-Math.floor((a.x1-a.x0)/bw)));
}
function priceRange(vis){
  if(!vis.length)return{min:0,max:1};
  let mn=Infinity,mx=-Infinity;
  vis.forEach(c=>{if(c.low<mn)mn=c.low;if(c.high>mx)mx=c.high;});
  const p=(mx-mn)*.06;return{min:mn-p,max:mx+p};
}
function p2y(p,mn,mx,a){return a.y0+(a.y1-a.y0)*(1-(p-mn)/(mx-mn));}
function y2p(y,mn,mx,a){return mn+(1-(y-a.y0)/(a.y1-a.y0))*(mx-mn);}
function i2x(i,n,a){return a.x0+(i+.5)*(a.x1-a.x0)/n;}
function fmt(n){return n&&n>0?Number(n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}):'--';}
function fmtS(n){if(!n||n<=0)return'--';if(n>=1000)return(n/1000).toFixed(1)+'K';return Number(n).toFixed(1);}

/* ═══════ 상태 표시 ═══════ */
function setStatus(text,mode){
  document.getElementById('cst').textContent=text;
  const dot=document.getElementById('conn-dot');
  dot.className='dot '+(mode==='ws'?'live-dot':mode==='rest'?'rest-dot':'dead-dot');
  const badge=document.getElementById('src-badge');
  if(mode==='ws'){
    badge.textContent='FUTURES · WS 실시간';
    badge.style.cssText='font-size:9px;padding:1px 7px;border-radius:3px;font-weight:600;letter-spacing:.3px;background:rgba(63,185,80,.12);color:#3fb950;border:1px solid rgba(63,185,80,.3)';
  }else if(mode==='rest'){
    badge.textContent='FUTURES · REST 폴링';
    badge.style.cssText='font-size:9px;padding:1px 7px;border-radius:3px;font-weight:600;letter-spacing:.3px;background:rgba(210,153,34,.12);color:#e3b341;border:1px solid rgba(210,153,34,.3)';
  }else{
    badge.textContent='연결 중...';
    badge.style.cssText='font-size:9px;padding:1px 7px;border-radius:3px;font-weight:600;letter-spacing:.3px;background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.3)';
  }
}

/* ═══════ 가격 업데이트 ═══════ */
function updatePrice(price,high,low,vol,op){
  if(price>0) document.getElementById('pbig').textContent='$'+fmt(price);
  if(high>0)  document.getElementById('h24').textContent='$'+fmt(high);
  if(low>0)   document.getElementById('l24').textContent='$'+fmt(low);
  if(vol>0)   document.getElementById('v24').textContent=(vol/1e9).toFixed(2)+'B';
  if(op>0)    openPrice=op;
  if(price>0&&openPrice>0){
    const ch=((price-openPrice)/openPrice*100).toFixed(2);
    const el=document.getElementById('pch');
    el.textContent=(+ch>=0?'+':'')+ch+'%';
    el.className='chg '+(+ch>=0?'up':'dn');
  }
}

/* ═══════ REST 폴링 ═══════ */

async function fetchJSON(url,timeout=10000){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
    clearTimeout(t);
    if(!r.ok)throw new Error(r.status);
    return await r.json();
  }catch(e){clearTimeout(t);throw e;}
}

function startPolling(){
  stopPolling();

  // 1. 가격 폴링: 3초마다 — WS 살아있어도 항상 실행 (백업 보장)
  pricePollId=setInterval(async()=>{
    try{
      const d=await fetchJSON(`${FAPI}/ticker/price?symbol=${currentSym}`,5000);
      const p=+d.price;
      if(p>0) updatePrice(p,0,0,0,0);
    }catch(e){}
  },3000);

  ticker24Id=setInterval(async()=>{
    try{
      const d=await fetchJSON(`${FAPI}/ticker/24hr?symbol=${currentSym}`,8000);
      updatePrice(+(d.lastPrice||0),+(d.highPrice||0),+(d.lowPrice||0),+(d.quoteVolume||0),+(d.openPrice||0));
      if(!wsAlive) setStatus('REST 폴링 · Binance Futures','rest');
    }catch(e){}
  },8000);

  candlePollId=setInterval(async()=>{
    if(wsAlive)return;
    try{
      const data=await fetchJSON(`${FAPI}/klines?symbol=${currentSym}&interval=${tf}&limit=5`,8000);
      if(!Array.isArray(data))return;
      data.forEach(d=>{
        const c={time:+d[0],open:+d[1],high:+d[2],low:+d[3],close:+d[4],vol:+d[5]};
        const idx=candles.findIndex(x=>x.time===c.time);
        if(idx>=0)candles[idx]=c; else{candles.push(c);if(candles.length>800)candles.shift();}
      });
      scheduleDraw();
      if(candles.length%8===0)scheduleAI();
    }catch(e){}
  },10000);
}

function stopPolling(){
  if(pricePollId)clearInterval(pricePollId);
  if(ticker24Id)clearInterval(ticker24Id);
  if(candlePollId)clearInterval(candlePollId);
  pricePollId=ticker24Id=candlePollId=null;
}

/* ═══════ WebSocket ═══════ */
let wsRetry=0;
const WS_URLS=tf=>{
  const s=currentSym.toLowerCase();
  return[
    `wss://fstream.binance.com/stream?streams=${s}@aggTrade/${s}@kline_${tf}/${s}@miniTicker`,
    `wss://fstream1.binance.com/stream?streams=${s}@aggTrade/${s}@kline_${tf}/${s}@miniTicker`,
    `wss://fstream2.binance.com/stream?streams=${s}@aggTrade/${s}@kline_${tf}/${s}@miniTicker`,
  ];
};

function connectWS(){
  if(ws){try{ws.close();}catch(e){}}
  wsAlive=false;
  const urls=WS_URLS(tf);
  const url=urls[wsRetry%urls.length];

  let opened=false;
  const openTimeout=setTimeout(()=>{
    if(!opened){
      if(ws)try{ws.close();}catch(e){}
      scheduleWSRetry();
    }
  },12000);

  try{ws=new WebSocket(url);}catch(e){clearTimeout(openTimeout);scheduleWSRetry();return;}

  ws.onopen=()=>{
    opened=true;clearTimeout(openTimeout);
    wsAlive=true;wsRetry=0;
    setStatus('WebSocket 실시간 · Binance Futures','ws');
  };

  ws.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.stream&&msg.data){
        const s=msg.stream,d=msg.data;
        if(s.includes('@aggTrade'))  onAggTrade(d);
        if(s.includes('@kline'))     onKline(d.k);
        if(s.includes('@miniTicker'))onMini(d);
        if(s.includes('@ticker'))    onTicker(d);
      }
      if(msg.e==='aggTrade')        onAggTrade(msg);
      if(msg.e==='kline')           onKline(msg.k);
      if(msg.e==='24hrMiniTicker')  onMini(msg);
      if(msg.e==='24hrTicker')      onTicker(msg);
    }catch(err){}
  };

  ws.onclose=()=>{wsAlive=false;scheduleWSRetry();};
  ws.onerror=()=>{wsAlive=false;try{ws.close();}catch(e){}};
}

function onKline(k){
  // ── 버그1 수정: open을 절대 덮어쓰지 않음 ──
  const incoming={
    time: +k.t,
    open: +k.o,   // kline의 open은 신뢰
    high: +k.h,
    low:  +k.l,
    close:+k.c,
    vol:  +k.v
  };
  if(!incoming.time||!incoming.open||!incoming.close) return; // 유효성 검사

  const last=candles[candles.length-1];
  if(last&&last.time===incoming.time){
    // 기존 캔들 업데이트 — open은 최초값 유지!
    last.high  = Math.max(last.high, incoming.high);
    last.low   = Math.min(last.low,  incoming.low);
    last.close = incoming.close;
    last.vol   = incoming.vol;
    // open은 절대 변경 안 함 (최초 시가 보존)
  } else if(!last||incoming.time>last.time){
    // 새 캔들 추가
    candles.push(incoming);
    if(candles.length>800) candles.shift();
    // 새 캔들마다 AI 재분석
    scheduleAI();
  }
  scheduleDraw();
}

// aggTrade: 체결마다 실시간 가격 (가장 빠른 소스)
function onAggTrade(d){
  const p=+(d.p||0);
  if(p<=0) return;
  updatePrice(p,0,0,0,0);
  if(candles.length>0){
    const last=candles[candles.length-1];
    // open은 절대 건드리지 않음!
    if(p>last.high) last.high=p;
    if(p<last.low)  last.low=p;
    last.close=p;
    checkFibAlert(p);
  }
  scheduleDraw(); // 즉시 draw() 대신 RAF throttle
}
function onMini(d){
  // miniTicker: c=현재가, h=고가, l=저가, q=거래대금, o=시가(openPrice 기준)
  const c=+(d.c||0),h=+(d.h||0),l=+(d.l||0),q=+(d.q||0),op=+(d.o||0);
  updatePrice(c,h,l,q,op); // 버그1 수정: openPrice(op) 전달
}
function onTicker(d){
  const c=+(d.c||d.C||0),h=+(d.h||d.H||0),l=+(d.l||d.L||0);
  const q=+(d.q||d.Q||0),op=+(d.o||d.O||0);
  updatePrice(c,h,l,q,op);
}

function scheduleWSRetry(){
  wsAlive=false;wsRetry++;
  const delay=Math.min(wsRetry*3000,15000);
  setStatus(`WS 재연결 대기 (${delay/1000}s) · REST 폴링 중`,'rest');
  setTimeout(connectWS,delay);
}

/* ═══════ 초기 데이터 로드 ═══════ */
async function loadCandles(){
  candles=[];aiLines=[];aiFib=null;aiPivots=[];aiChannels=[];aiHzones=[];
  wsAlive=false;wsRetry=0;
  document.getElementById('spin-wrap').style.display='flex';
  document.getElementById('spin-msg').textContent='데이터 로딩 중...';
  ['a-fib','a-r2','a-ch'].forEach(id=>document.getElementById(id).style.display='none');
  setStatus('데이터 로딩 중...','');

  // 폴링은 항상 시작 (WS 연결 여부와 무관하게 백업)
  startPolling();

  // 초기 24H 데이터 먼저 가져오기
  try{
    const d=await fetchJSON(`${FAPI}/ticker/24hr?symbol=${currentSym}`,10000);
    updatePrice(+(d.lastPrice||0),+(d.highPrice||0),+(d.lowPrice||0),+(d.quoteVolume||0),+(d.openPrice||0));
  }catch(e){}

  let loaded=false;
  const klineURLs=[
    `${FAPI}/klines?symbol=${currentSym}&interval=${tf}&limit=300`,
    `https://fapi.binance.com/fapi/v2/klines?symbol=${currentSym}&interval=${tf}&limit=300`,
  ];
  for(let i=0;i<klineURLs.length;i++){
    try{
      document.getElementById('spin-msg').textContent=`캔들 로드 중 (${i+1}/${klineURLs.length})...`;
      const data=await fetchJSON(klineURLs[i],12000);
      if(!Array.isArray(data)||data.length<10)throw new Error('empty');
      candles=data.map(d=>({time:+d[0],open:+d[1],high:+d[2],low:+d[3],close:+d[4],vol:+d[5]}));
      // 이상값 필터: 중앙값 기준 ±60% 벗어난 캔들 제거
      if(candles.length>10){
        const mids=candles.map(c=>c.close).sort((a,b)=>a-b);
        const median=mids[Math.floor(mids.length/2)];
        candles=candles.filter(c=>c.close>median*0.4&&c.close<median*2.5&&c.high>0&&c.low>0&&c.high>=c.low);
      }
      loaded=true;
      // 마지막 캔들 가격 즉시 표시
      const last=candles[candles.length-1];
      if(last&&last.close>0)updatePrice(last.close,0,0,0,0);
      break;
    }catch(e){
      await new Promise(r=>setTimeout(r,1000));
    }
  }

  document.getElementById('spin-wrap').style.display='none';

  if(loaded){
    runAI(getVis());draw();
    setStatus('REST 폴링 · Binance Futures','rest');
  }else{
    draw(); // 빈 차트라도 표시
    setStatus('캔들 로드 실패 · 가격만 폴링 중','rest');
  }

  // WS 연결 시도 (폴링과 병행)
  connectWS();
  // OI 폴링 시작
  startOIPoll();
}

/* ═══════ 피보나치 레벨 근접 알림 ═══════ */
let fibAlertCooldown={};
function checkFibAlert(price){
  if(!alertEnabled||!audioCtx||!aiFib)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  const range=aiFib.high-aiFib.low;
  FIB_R.forEach((r,ri)=>{
    const p=aiFib.high-range*r;
    const dist=Math.abs(price-p)/p;
    if(dist<0.003){// 0.3% 이내 접근
      const now=Date.now();
      if(!fibAlertCooldown[ri]||now-fibAlertCooldown[ri]>30000){// 30초 쿨다운
        fibAlertCooldown[ri]=now;
        const isKey=r===0.618;
        playFibAlert(FIB_C[ri],isKey);
        showFibToast(FIB_L[ri],p,isKey);
      }
    }
  });
}
function playFibAlert(color,isKey){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const freqs=isKey?[880,1100,880]:[660,880];
  freqs.forEach((freq,i)=>{
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.connect(g);g.connect(audioCtx.destination);
    osc.type='sine';osc.frequency.value=freq;
    g.gain.setValueAtTime(0,now+i*.12);
    g.gain.linearRampToValueAtTime(isKey?.25:.15,now+i*.12+.04);
    g.gain.exponentialRampToValueAtTime(.001,now+i*.12+.25);
    osc.start(now+i*.12);osc.stop(now+i*.12+.3);
  });
}
function showFibToast(level,price,isKey){
  let t=document.getElementById('fib-toast');
  if(!t){t=document.createElement('div');t.id='fib-toast';
    t.style.cssText='position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:9999;'+
      'padding:10px 18px;border-radius:8px;font-family:Courier New,monospace;font-size:12px;'+
      'font-weight:600;pointer-events:none;transition:opacity .35s;white-space:nowrap;'+
      'box-shadow:0 4px 20px rgba(0,0,0,.6);text-align:center;line-height:1.6';
    document.body.appendChild(t);}
  // 레벨 인덱스 찾기
  const idx=FIB_L_SHORT.indexOf(level);
  const desc=idx>=0?FIB_DESC[idx]:'';
  const col=idx>=0?FIB_C[idx]:'#58a6ff';
  t.innerHTML=`<div>📐 피보나치 ${level} 도달${isKey?' ⭐':''}</div>`+
    `<div style="font-size:10px;opacity:.8;margin-top:2px">$${fmt(price)} ${desc?'· '+desc:''}</div>`;
  t.style.background=isKey?'rgba(255,112,67,.2)':'rgba(88,166,255,.15)';
  t.style.color=col;
  t.style.border=`1px solid ${col}55`;
  t.style.opacity='1';clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.opacity='0',4000);
}
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playAlert(type){
  if(!alertEnabled||!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  const notes=type==='buy'?[[523,0],[659,.13],[784,.26]]:[[784,0],[659,.13],[523,.26]];
  notes.forEach(([freq,delay])=>{
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.connect(g);g.connect(audioCtx.destination);
    osc.type=type==='buy'?'sine':'triangle';osc.frequency.value=freq;
    g.gain.setValueAtTime(0,now+delay);
    g.gain.linearRampToValueAtTime(.3,now+delay+.03);
    g.gain.exponentialRampToValueAtTime(.001,now+delay+.28);
    osc.start(now+delay);osc.stop(now+delay+.3);
  });
}
function showToast(dir){
  let t=document.getElementById('alert-toast');
  if(!t){t=document.createElement('div');t.id='alert-toast';
    t.style.cssText='position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;'+
      'padding:10px 24px;border-radius:8px;font-family:Courier New,monospace;font-size:13px;'+
      'font-weight:600;pointer-events:none;transition:opacity .35s;white-space:nowrap;'+
      'box-shadow:0 4px 24px rgba(0,0,0,.55)';
    document.body.appendChild(t);}
  const isBuy=dir==='buy';
  t.textContent=isBuy?'🔔 신호 전환 → 매수':'🔔 신호 전환 → 매도';
  t.style.background=isBuy?'rgba(63,185,80,.18)':'rgba(248,81,73,.18)';
  t.style.color=isBuy?'#3fb950':'#f85149';
  t.style.border=`1px solid ${isBuy?'rgba(63,185,80,.45)':'rgba(248,81,73,.45)'}`;
  t.style.opacity='1';clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.opacity='0',3500);
}

/* ═══════ SIGNAL ENGINE ═══════ */
function emaArr(arr,p){
  if(!arr.length)return[];
  const k=2/(p+1),res=[arr[0]];
  for(let i=1;i<arr.length;i++)res.push(arr[i]*k+res[i-1]*(1-k));
  return res;
}
function calcRSI(closes,p=14){
  if(closes.length<p+2)return 50;
  let ag=0,al=0;
  for(let i=closes.length-p;i<closes.length;i++){const d=closes[i]-closes[i-1];d>=0?ag+=d:al-=d;}
  ag/=p;al/=p;return al===0?100:100-100/(1+ag/al);
}
function calcMACD(closes){
  if(closes.length<35)return{hist:0,crossUp:false,crossDn:false,histExpanding:false,macd:0};
  const e12=emaArr(closes,12),e26=emaArr(closes,26);
  const ml=e12.map((v,i)=>v-e26[i]),sl=emaArr(ml,9);
  const n=ml.length-1,m=ml[n],s=sl[n];
  return{macd:m,signal:s,hist:m-s,crossUp:ml[n-1]<=sl[n-1]&&m>s,crossDn:ml[n-1]>=sl[n-1]&&m<s,
    histExpanding:Math.abs(m-s)>Math.abs(ml[n-1]-sl[n-1])};
}
function calcBB(closes,p=20){
  if(closes.length<p)return null;
  const sl=closes.slice(-p),ma=sl.reduce((a,b)=>a+b)/p;
  const std=Math.sqrt(sl.reduce((s,v)=>s+(v-ma)**2,0)/p);
  const last=closes[closes.length-1],range=4*std||1;
  return{upper:ma+2*std,mid:ma,lower:ma-2*std,
    pct:Math.max(0,Math.min(100,((last-(ma-2*std))/range)*100)),aboveMid:last>ma};
}
function calcSignal(cs){
  if(cs.length<30)return{score:0,strength:0,direction:'neutral',signals:[],rsi:50,macd:{hist:0,crossUp:false,crossDn:false,histExpanding:false},bb:null};
  const closes=cs.map(c=>c.close),last=cs[cs.length-1],n=closes.length;
  const rsi=calcRSI(closes),macd=calcMACD(closes),bb=calcBB(closes);
  const e9a=emaArr(closes,9),e21a=emaArr(closes,21),e55a=emaArr(closes,Math.min(55,n));
  const e9=e9a[e9a.length-1],pe9=e9a[e9a.length-2]||e9,e21=e21a[e21a.length-1],e55=e55a[e55a.length-1];
  let score=0;const sigs=[];
  if(e9>e21&&e21>e55&&last.close>e9){score+=30;sigs.push({name:'EMA 정배열',val:'상승',dir:'buy',cat:'추세'});}
  else if(e9>e21&&e21>e55){score+=18;sigs.push({name:'EMA 상승배열',val:'↑',dir:'buy',cat:'추세'});}
  else if(e9<e21&&e21<e55&&last.close<e9){score-=30;sigs.push({name:'EMA 역배열',val:'하락',dir:'sell',cat:'추세'});}
  else if(e9<e21&&e21<e55){score-=18;sigs.push({name:'EMA 하락배열',val:'↓',dir:'sell',cat:'추세'});}
  else{score+=e9>e21?8:-8;}
  const sl=(e9-pe9)/pe9*100;
  if(sl>0.12){score+=15;sigs.push({name:'EMA 상승가속',val:'+'+sl.toFixed(2)+'%',dir:'buy',cat:'추세'});}
  else if(sl<-0.12){score-=15;sigs.push({name:'EMA 하락가속',val:sl.toFixed(2)+'%',dir:'sell',cat:'추세'});}
  if(macd.crossUp){score+=30;sigs.push({name:'MACD 골든크로스',val:'↑',dir:'buy',cat:'MACD'});}
  else if(macd.crossDn){score-=30;sigs.push({name:'MACD 데드크로스',val:'↓',dir:'sell',cat:'MACD'});}
  else if(macd.hist>0&&macd.histExpanding){score+=18;sigs.push({name:'MACD 상승확장',val:'+',dir:'buy',cat:'MACD'});}
  else if(macd.hist<0&&macd.histExpanding){score-=18;sigs.push({name:'MACD 하락확장',val:'-',dir:'sell',cat:'MACD'});}
  else{score+=macd.hist>0?8:-8;}
  if(rsi>50&&rsi<72){score+=10;sigs.push({name:'RSI 강세권',val:rsi.toFixed(1),dir:'buy',cat:'RSI'});}
  else if(rsi<50&&rsi>28){score-=10;sigs.push({name:'RSI 약세권',val:rsi.toFixed(1),dir:'sell',cat:'RSI'});}
  else if(rsi>=72){score+=4;sigs.push({name:'RSI 과열',val:rsi.toFixed(1),dir:'caution',cat:'RSI'});}
  else if(rsi<=28){score-=4;sigs.push({name:'RSI 침체',val:rsi.toFixed(1),dir:'caution',cat:'RSI'});}
  if(bb){
    if(bb.aboveMid&&bb.pct>45&&bb.pct<88){score+=10;sigs.push({name:'BB 중상단',val:bb.pct.toFixed(0)+'%',dir:'buy',cat:'BB'});}
    else if(!bb.aboveMid&&bb.pct<55&&bb.pct>12){score-=10;sigs.push({name:'BB 중하단',val:bb.pct.toFixed(0)+'%',dir:'sell',cat:'BB'});}
  }

  // ── MA20 / MA60 골든·데드크로스 ──────────────────────────
  if(cs.length>=62){
    const ma20arr=calcMASimple(closes,20),ma60arr=calcMASimple(closes,60);
    const m20=ma20arr[n-1],m20p=ma20arr[n-2],m60=ma60arr[n-1],m60p=ma60arr[n-2];
    if(m20&&m60&&m20p&&m60p){
      const goldenCross = m20>m60 && m20p<=m60p;
      const deadCross   = m20<m60 && m20p>=m60p;
      const aboveMA20   = last.close>m20;
      const aboveMA60   = last.close>m60;
      if(goldenCross){score+=35;sigs.push({name:'MA20/60 골든크로스',val:'↑',dir:'buy',cat:'MA크로스'});}
      else if(deadCross){score-=35;sigs.push({name:'MA20/60 데드크로스',val:'↓',dir:'sell',cat:'MA크로스'});}
      else if(m20>m60&&aboveMA20){score+=18;sigs.push({name:'MA 정배열 (20>60)',val:'상승',dir:'buy',cat:'MA크로스'});}
      else if(m20<m60&&!aboveMA60){score-=18;sigs.push({name:'MA 역배열 (20<60)',val:'하락',dir:'sell',cat:'MA크로스'});}
      else{score+=m20>m60?8:-8;}
    }
  }

  // ── 일목균형표 구름대 ──────────────────────────────────────
  if(cs.length>=52){
    const ichi=calcIchimoku(cs);
    const ic=ichi[n-1],ic2=ichi[n-2];
    if(ic?.spanA&&ic?.spanB){
      const cloudTop=Math.max(ic.spanA,ic.spanB);
      const cloudBot=Math.min(ic.spanA,ic.spanB);
      const wasBelow = ic2 ? last.close > Math.max(ic2.spanA||0,ic2.spanB||0) : false;
      const aboveCloud = last.close > cloudTop;
      const belowCloud = last.close < cloudBot;
      const bullCloud  = ic.spanA > ic.spanB; // 상승구름
      // 구름 돌파 (가장 강한 신호)
      if(aboveCloud&&bullCloud){score+=30;sigs.push({name:'☁ 구름 위 (상승구름)',val:'강세',dir:'buy',cat:'구름대'});}
      else if(aboveCloud&&!bullCloud){score+=15;sigs.push({name:'☁ 구름 위 (하락구름)',val:'약강세',dir:'buy',cat:'구름대'});}
      else if(belowCloud&&!bullCloud){score-=30;sigs.push({name:'☁ 구름 아래 (하락구름)',val:'약세',dir:'sell',cat:'구름대'});}
      else if(belowCloud&&bullCloud){score-=15;sigs.push({name:'☁ 구름 아래 (상승구름)',val:'약약세',dir:'sell',cat:'구름대'});}
      else{sigs.push({name:'☁ 구름 안 (관망)',val:'중립',dir:'caution',cat:'구름대'});}
      // 전환선/기준선 크로스
      if(ic.tenkan&&ic.kijun){
        if(ic.tenkan>ic.kijun){score+=10;sigs.push({name:'전환선>기준선',val:'↑',dir:'buy',cat:'구름대'});}
        else{score-=10;sigs.push({name:'전환선<기준선',val:'↓',dir:'sell',cat:'구름대'});}
      }
    }
  }
  if(n>=11){
    const mom=(last.close-closes[n-11])/closes[n-11]*100;
    if(mom>2.5){score+=12;sigs.push({name:'강한 상승',val:'+'+mom.toFixed(1)+'%',dir:'buy',cat:'모멘텀'});}
    else if(mom>0.8){score+=6;sigs.push({name:'약한 상승',val:'+'+mom.toFixed(1)+'%',dir:'buy',cat:'모멘텀'});}
    else if(mom<-2.5){score-=12;sigs.push({name:'강한 하락',val:mom.toFixed(1)+'%',dir:'sell',cat:'모멘텀'});}
    else if(mom<-0.8){score-=6;sigs.push({name:'약한 하락',val:mom.toFixed(1)+'%',dir:'sell',cat:'모멘텀'});}
  }
  const direction=score>=18?'buy':score<=-18?'sell':'neutral';
  return{score,strength:Math.min(100,Math.abs(score)),direction,signals:sigs,rsi,macd,bb};
}

/* ═══════ AI 추세선 ═══════ */
function findPivots(cs,sw){
  const H=[],L=[];
  for(let i=sw;i<cs.length-sw;i++){
    let ih=true,il=true;
    for(let j=1;j<=sw;j++){if(cs[i].high<=cs[i-j].high||cs[i].high<=cs[i+j].high)ih=false;if(cs[i].low>=cs[i-j].low||cs[i].low>=cs[i+j].low)il=false;}
    if(ih)H.push({i,p:cs[i].high});if(il)L.push({i,p:cs[i].low});
  }
  return{H,L};
}
function linReg(pts){
  const n=pts.length;if(n<2)return null;
  let sx=0,sy=0,sxy=0,sx2=0;
  pts.forEach(p=>{sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sx2+=p.x*p.x;});
  const d=n*sx2-sx*sx;if(Math.abs(d)<1e-10)return null;
  const m=(n*sxy-sx*sy)/d,b=(sy-m*sx)/n;
  const yh=pts.map(p=>m*p.x+b),ym=sy/n;
  const ss=pts.reduce((s,p)=>s+(p.y-ym)**2,0),sr=pts.reduce((s,p,i)=>s+(p.y-yh[i])**2,0);
  return{m,b,r2:ss>0?1-sr/ss:1};
}
function searchLines(pivots,type,total){
  const found=[],minSpan=total*.08;
  for(let w=2;w<=Math.min(pivots.length,9);w++){
    for(let s=0;s<=pivots.length-w;s++){
      const pts=pivots.slice(s,s+w);
      if(pts[pts.length-1].i-pts[0].i<minSpan)continue;
      const r=linReg(pts.map(p=>({x:p.i,y:p.p})));
      if(r&&r.r2>.52)found.push({type,r2:r.r2,m:r.m,b:r.b,i0:pts[0].i,i1:pts[pts.length-1].i,p0:r.m*pts[0].i+r.b,p1:r.m*pts[pts.length-1].i+r.b});
    }
  }
  found.sort((a,b)=>b.r2-a.r2);
  const kept=[];
  found.forEach(l=>{const dup=kept.some(k=>{const sp=Math.max(l.i1,k.i1)-Math.min(l.i0,k.i0),ol=Math.min(l.i1,k.i1)-Math.max(l.i0,k.i0);return sp>0&&ol/sp>.5;});if(!dup)kept.push(l);});
  return kept.slice(0,3);
}
function runAI(vis){
  if(vis.length<20)return;
  const sw=Math.max(2,Math.floor(vis.length/16));
  const{H,L}=findPivots(vis,sw);
  aiPivots=[...H.map(h=>({...h,type:'H'})),...L.map(l=>({...l,type:'L'}))];
  const rL=searchLines(H,'resist',vis.length),sL=searchLines(L,'support',vis.length);
  aiLines=[...rL,...sL];
  aiChannels=[];
  sL.forEach(s=>rL.forEach(r=>{const avg=Math.abs((s.m+r.m)/2),diff=Math.abs(s.m-r.m);if(avg===0||diff/(avg+1e-9)<.45)aiChannels.push({s,r,label:s.m>0?'상승채널':s.m<0?'하락채널':'수평채널'});}));
  if(H.length&&L.length){
    const rH=H.slice(-4),rL2=L.slice(-4);
    let fH=Math.max(...rH.map(h=>h.p));
    let fL=Math.min(...rL2.map(l=>l.p));

    // ── 이상값 필터 ──────────────────────────────
    // 현재가 기준 ±40% 벗어난 값은 스윙으로 사용 안 함
    const curPrice = vis[vis.length-1]?.close || fH;
    const maxAllowed = curPrice * 1.4;
    const minAllowed = curPrice * 0.6;

    // 필터 통과한 피벗만 사용
    const validH = rH.filter(h => h.p <= maxAllowed && h.p >= minAllowed);
    const validL = rL2.filter(l => l.p <= maxAllowed && l.p >= minAllowed);

    // 유효한 피벗이 없으면 보이는 캔들 범위로 대체
    if(validH.length) fH = Math.max(...validH.map(h=>h.p));
    else fH = Math.max(...vis.map(c=>c.high));

    if(validL.length) fL = Math.min(...validL.map(l=>l.p));
    else fL = Math.min(...vis.map(c=>c.low));

    // 범위가 너무 크면 (현재가 대비 30% 이상) 최근 캔들 기준으로 재계산
    const rangeRatio = (fH - fL) / curPrice;
    if(rangeRatio > 0.3){
      const recent = vis.slice(-Math.min(80, vis.length));
      fH = Math.max(...recent.map(c=>c.high));
      fL = Math.min(...recent.map(c=>c.low));
    }

    // 고점 < 저점 이상 케이스 방어
    if(fH <= fL || fH === 0 || fL === 0) return;

    const hiO = (validH.find(h=>h.p===fH)) || {i: vis.length-1, p: fH};
    const loO = (validL.find(l=>l.p===fL)) || {i: 0, p: fL};
    aiFib={i0:Math.min(hiO.i,loO.i),p0:fL,i1:Math.max(hiO.i,loO.i),p1:fH,high:fH,low:fL};
  }
  const allP=[...H.map(h=>h.p),...L.map(l=>l.p)];
  aiHzones=[];
  if(allP.length>=2){
    const mn=Math.min(...allP),mx=Math.max(...allP),bk=(mx-mn)/14,map={};
    allP.forEach(p=>{const k=Math.round(p/bk);if(!map[k])map[k]=[];map[k].push(p);});
    Object.values(map).filter(v=>v.length>=2).forEach(v=>aiHzones.push({price:v.reduce((a,b)=>a+b)/v.length,count:v.length}));
    aiHzones.sort((a,b)=>b.count-a.count);aiHzones=aiHzones.slice(0,6);
  }
  updateAIBadges(vis);updateFibBar();
  document.getElementById('tln').textContent=aiLines.length;
  document.getElementById('chn').textContent=aiChannels.length;
  updateSignalPanel(calcSignal(candles));
}
function updateAIBadges(vis){
  const sL=aiLines.filter(l=>l.type==='support'),rL=aiLines.filter(l=>l.type==='resist');
  let tt='횡보',tc='a-neu';
  if(aiChannels.length){tt=aiChannels[0].label+' 감지';tc='a-ch';}
  else if(sL.filter(l=>l.m>0).length&&!rL.filter(l=>l.m<0).length){tt='▲ 상승추세';tc='a-up';}
  else if(rL.filter(l=>l.m<0).length&&!sL.filter(l=>l.m>0).length){tt='▼ 하락추세';tc='a-dn';}
  else if(sL.length&&rL.length){tt='◆ 수렴쐐기';tc='a-ch';}
  setA('a-trend',tt,tc);
  const chEl=document.getElementById('a-ch');
  if(aiChannels.length){const bc=aiChannels[0];chEl.textContent=`채널 R²=${((bc.s.r2+bc.r.r2)/2).toFixed(2)}`;chEl.className='abadge a-ch';chEl.style.display='inline-flex';}
  else chEl.style.display='none';

function triggerCrossAlert(isGolden, price){
  const now = Date.now();
  if(now - crossAlertCooldown < 60000) return; // 1분 쿨다운
  crossAlertCooldown = now;

  if(isGolden) playCrossSound('golden');
  else playCrossSound('dead');

  showCrossOverlay(isGolden, price);
  showCrossToast(isGolden, price);
  flashScreen(isGolden);
}

function playCrossSound(type){
  if(!alertEnabled) return;
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime;
    if(type==='golden'){
      // 상승 3연음 + 화음
      [[523,0],[659,0.12],[784,0.24],[1047,0.38]].forEach(([freq,t])=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);
        o.type='sine';o.frequency.value=freq;
        g.gain.setValueAtTime(0,now+t);
        g.gain.linearRampToValueAtTime(0.3,now+t+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,now+t+0.45);
        o.start(now+t);o.stop(now+t+0.5);
      });
    } else {
      // 하락 3연음
      [[523,0],[415,0.15],[311,0.3]].forEach(([freq,t])=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);
        o.type='sawtooth';o.frequency.value=freq;
        g.gain.setValueAtTime(0,now+t);
        g.gain.linearRampToValueAtTime(0.2,now+t+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,now+t+0.5);
        o.start(now+t);o.stop(now+t+0.55);
      });
    }
  }catch(e){}
}

/* ═══════ 크로스 감지 → 이벤트 발동 ═══════ */
function checkCrossEvent(gc){
  if(!gc) return;
  const {isGolden, justCrossed} = gc;
  const newState = isGolden?'golden':'dead';
  if(justCrossed && newState !== lastCrossState){
    lastCrossState = newState;
    const price = candles.length? candles[candles.length-1].close : 0;
    triggerCrossAlert(isGolden, price);
  } else if(!justCrossed && lastCrossState===null){
    lastCrossState = newState; // 초기 상태 세팅 (알림 없이)
  }
}
function calcIchimoku(candles){
  const high=(arr,s,e)=>Math.max(...arr.slice(s,e).map(c=>c.high));
  const low=(arr,s,e)=>Math.min(...arr.slice(s,e).map(c=>c.low));
  return candles.map((_,i,a)=>{
    const tenkan  = i>=8  ? (high(a,i-8,i+1)+low(a,i-8,i+1))/2   : null;
    const kijun   = i>=25 ? (high(a,i-25,i+1)+low(a,i-25,i+1))/2 : null;
    const spanA   = (tenkan&&kijun) ? (tenkan+kijun)/2 : null;
    const spanB   = i>=51 ? (high(a,i-51,i+1)+low(a,i-51,i+1))/2 : null;
    const chikou  = i>=26 ? a[i-26].close : null;
    return {tenkan,kijun,spanA,spanB,chikou};
  });
}

/* ═══════ MA20 / MA60 골든크로스 감지 ═══════ */
function calcMASimple(closes,period){
  return closes.map((_,i)=>{
    if(i<period-1) return null;
    return closes.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period;
  });
}
function detectGoldenCross(candles){
  if(candles.length<62) return null;
  const closes=candles.map(c=>c.close);
  const ma20=calcMASimple(closes,20);
  const ma60=calcMASimple(closes,60);
  const last=candles.length-1;
  const prev=last-1;
  // 현재 골든/데드크로스 상태
  const isGolden = ma20[last]>ma60[last];
  const wasGolden = ma20[prev]>ma60[prev];
  const justCrossed = isGolden!==wasGolden; // 방금 크로스
  return {ma20,ma60,isGolden,justCrossed,crossIdx:justCrossed?last:null};
}

function draw(){
  const a=area(),W=mc.clientWidth,H=CH();
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  const vis=getVis();
  if(!vis.length){ctx.fillStyle='#484f58';ctx.font='12px Courier New';ctx.textAlign='center';ctx.fillText('데이터 없음',W/2,H/2);return;}
  const{min:mn,max:mx}=priceRange(vis);const N=vis.length;const cw=Math.max(2,(a.x1-a.x0)/N-1);
  const mob=isMob(),lf=mob?'9px Courier New':'10px Courier New',sf=mob?'8px Courier New':'9px Courier New';
  for(let i=0;i<=5;i++){
    const y=a.y0+(a.y1-a.y0)*i/5;
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.font=lf;ctx.textAlign='left';ctx.fillText('$'+fmt(mx-(mx-mn)*i/5),a.x1+2,y+3);
  }
  let maxV=0;vis.forEach(c=>{if(c.vol>maxV)maxV=c.vol;});
  vis.forEach((c,i)=>{const x=i2x(i,N,a),vh=(c.vol/maxV)*(a.vY1-a.vY0)*.85;ctx.fillStyle=c.close>=c.open?'rgba(38,166,154,.28)':'rgba(239,83,80,.28)';ctx.fillRect(x-cw/2,a.vY1-vh,cw,vh);});
  if(showMA){
    const st=Math.max(0,candles.length-N);
    (mob?[[9,'rgba(255,200,60,.6)'],[21,'rgba(100,180,255,.55)']]:[[9,'rgba(255,200,60,.6)'],[21,'rgba(100,180,255,.6)'],[55,'rgba(200,100,255,.5)']]).forEach(([p,col])=>{
      if(candles.length<p)return;
      const ea=emaArr(candles.map(c=>c.close),p);
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();let first=true;
      vis.forEach((c,i)=>{const gi=st+i;if(gi>=ea.length)return;const y=p2y(ea[gi],mn,mx,a),x=i2x(i,N,a);if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);});
      ctx.stroke();ctx.setLineDash([]);
    });
  }

  // ── MA20 / MA60 (실선) + 골든/데드크로스 ──────────────────
  if(showGolden && candles.length>=62){
    const st=Math.max(0,candles.length-N);
    const gc=detectGoldenCross(candles);
    // 크로스 이벤트 감지 → 임팩트 알림 발동
    checkCrossEvent(gc);
    if(gc){
      const {ma20,ma60,isGolden,justCrossed,crossIdx}=gc;

      // MA20 — 하늘색 실선
      ctx.strokeStyle='rgba(56,189,248,.85)';ctx.lineWidth=1.5;ctx.setLineDash([]);
      ctx.beginPath();let f1=true;
      vis.forEach((c,i)=>{const gi=st+i;if(!ma20[gi])return;const y=p2y(ma20[gi],mn,mx,a),x=i2x(i,N,a);f1?(ctx.moveTo(x,y),f1=false):ctx.lineTo(x,y);});
      ctx.stroke();

      // MA60 — 보라색 실선
      ctx.strokeStyle='rgba(168,85,247,.85)';ctx.lineWidth=1.5;
      ctx.beginPath();let f2=true;
      vis.forEach((c,i)=>{const gi=st+i;if(!ma60[gi])return;const y=p2y(ma60[gi],mn,mx,a),x=i2x(i,N,a);f2?(ctx.moveTo(x,y),f2=false):ctx.lineTo(x,y);});
      ctx.stroke();

      // MA 라벨 (우측)
      const lastI=candles.length-1;
      if(ma20[lastI]){
        const y20=p2y(ma20[lastI],mn,mx,a);

        ctx.fillStyle='#000';ctx.font='bold 9px Courier New';ctx.textAlign='left';

      if(ma60[lastI]){

        ctx.fillStyle='#fff';ctx.font='bold 9px Courier New';ctx.textAlign='left';
        ctx.fillText('MA60',a.x1+3,y60+3);
      }

      // 골든/데드크로스 발생 위치 표시 — 임팩트 마커
      if(justCrossed&&crossIdx!==null){
        const ri=crossIdx-st;

          const price=candles[crossIdx].close;

          ctx.beginPath();ctx.roundRect(lx,ly,lw,lh,5);ctx.fill();
          ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
          ctx.fillStyle=col;
          ctx.font=`bold ${mob?'10':'11'}px Courier New`;
          ctx.textAlign='center';
          ctx.fillText(label,lx+lw/2,ly+lh/2+4);

          ctx.restore();
        }
      }

      // 현재 상태 뱃지 (좌상단)
      if(!mob){
        const bx=a.x0+6, by=a.y0+6;
        const bc=isGolden?'rgba(251,191,36,.18)':'rgba(248,113,113,.18)';
        const tc=isGolden?'#fbbf24':'#f87171';
        const bt=isGolden?'★ 골든크로스 (MA20>MA60)':'✕ 데드크로스 (MA20<MA60)';
        ctx.fillStyle=bc;
        ctx.beginPath();ctx.roundRect(bx,by,mob?80:180,18,4);ctx.fill();
        ctx.fillStyle=tc;ctx.font='bold 9px Courier New';ctx.textAlign='left';
        ctx.fillText(bt,bx+6,by+12);
      }
    }
  }

  // ── 일목균형표 구름대 ──────────────────────────────────────
  if(showIchimoku && candles.length>=52){
    const st=Math.max(0,candles.length-N);
    const ichi=calcIchimoku(candles);

    // 구름 채우기 (선행스팬A vs B)
    ctx.save();
    for(let i=1;i<N;i++){
      const gi=st+i;
      if(gi>=ichi.length)break;
      const prev=ichi[gi-1],curr=ichi[gi];
      if(!prev.spanA||!prev.spanB||!curr.spanA||!curr.spanB)continue;
      const x0=i2x(i-1,N,a),x1=i2x(i,N,a);
      const pA=p2y(prev.spanA,mn,mx,a),pB=p2y(prev.spanB,mn,mx,a);
      const cA=p2y(curr.spanA,mn,mx,a),cB=p2y(curr.spanB,mn,mx,a);
      // 상승구름=초록(spanA>spanB), 하락구름=빨강(spanB>spanA)
      const bullish=prev.spanA>prev.spanB;
      ctx.fillStyle=bullish?'rgba(38,166,154,.12)':'rgba(239,83,80,.10)';
      ctx.beginPath();
      ctx.moveTo(x0,pA);ctx.lineTo(x1,cA);
      ctx.lineTo(x1,cB);ctx.lineTo(x0,pB);
      ctx.closePath();ctx.fill();
    }

    // 선행스팬A 라인 (초록 점선)
    ctx.strokeStyle='rgba(38,166,154,.55)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();let fA=true;
    vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.spanA)return;const y=p2y(ichi[gi].spanA,mn,mx,a),x=i2x(i,N,a);fA?(ctx.moveTo(x,y),fA=false):ctx.lineTo(x,y);});
    ctx.stroke();

    // 선행스팬B 라인 (빨강 점선)
    ctx.strokeStyle='rgba(239,83,80,.55)';
    ctx.beginPath();let fB=true;
    vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.spanB)return;const y=p2y(ichi[gi].spanB,mn,mx,a),x=i2x(i,N,a);fB?(ctx.moveTo(x,y),fB=false):ctx.lineTo(x,y);});
    ctx.stroke();

    // 전환선 (빨강 실선)
    ctx.strokeStyle='rgba(255,100,100,.7)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();let fT=true;
    vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.tenkan)return;const y=p2y(ichi[gi].tenkan,mn,mx,a),x=i2x(i,N,a);fT?(ctx.moveTo(x,y),fT=false):ctx.lineTo(x,y);});
    ctx.stroke();

    // 기준선 (파랑 실선)
    ctx.strokeStyle='rgba(56,139,253,.7)';ctx.lineWidth=1.2;
    ctx.beginPath();let fK=true;
    vis.forEach((_,i)=>{const gi=st+i;if(!ichi[gi]?.kijun)return;const y=p2y(ichi[gi].kijun,mn,mx,a),x=i2x(i,N,a);fK?(ctx.moveTo(x,y),fK=false):ctx.lineTo(x,y);});
    ctx.stroke();
    ctx.setLineDash([]);

    // 구름 돌파 신호 감지
    const lastI=candles.length-1;
    const curIchi=ichi[lastI];
    const lastClose=vis[vis.length-1]?.close;
    if(curIchi?.spanA&&curIchi?.spanB&&lastClose){
      const cloudTop=Math.max(curIchi.spanA,curIchi.spanB);
      const cloudBot=Math.min(curIchi.spanA,curIchi.spanB);
      const aboveCloud=lastClose>cloudTop;
      const belowCloud=lastClose<cloudBot;
      const inCloud=!aboveCloud&&!belowCloud;
      if(!mob){
        const bx=a.x0+6, by=a.y0+28;
        let bt='',bc='',tc='';
        if(aboveCloud){bt='☁ 구름 위 (강세)';bc='rgba(38,166,154,.18)';tc='#34d399';}
        else if(belowCloud){bt='☁ 구름 아래 (약세)';bc='rgba(239,83,80,.18)';tc='#f87171';}
        else{bt='☁ 구름 안 (관망)';bc='rgba(250,204,21,.12)';tc='#fbbf24';}
        ctx.fillStyle=bc;
        ctx.beginPath();ctx.roundRect(bx,by,165,18,4);ctx.fill();
        ctx.fillStyle=tc;ctx.font='bold 9px Courier New';ctx.textAlign='left';
        ctx.fillText(bt,bx+6,by+12);
      }
    }
    ctx.restore();
  }
  vis.forEach((c,i)=>{
    const x=i2x(i,N,a),bull=c.close>=c.open,col=bull?'#26a69a':'#ef5350';
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,p2y(c.high,mn,mx,a));ctx.lineTo(x,p2y(c.low,mn,mx,a));ctx.stroke();
    const oy=p2y(c.open,mn,mx,a),cy=p2y(c.close,mn,mx,a),by=Math.min(oy,cy),bh=Math.max(1,Math.abs(cy-oy));
    ctx.fillStyle=col;ctx.fillRect(x-cw/2,by,cw,bh);if(cw>4){ctx.strokeStyle=col;ctx.strokeRect(x-cw/2,by,cw,bh);}
  });
  if(showHz)aiHzones.forEach(z=>{
    const y=p2y(z.price,mn,mx,a);if(y<a.y0||y>a.y1)return;
    const al=Math.min(.7,.2+z.count*.1);ctx.strokeStyle=`rgba(56,139,253,${al})`;ctx.lineWidth=z.count>=3?1:.6;
    ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();ctx.setLineDash([]);
    if(!mob){ctx.fillStyle=`rgba(88,166,255,${al})`;ctx.font=sf;ctx.textAlign='right';ctx.fillText('$'+fmt(z.price),a.x1-1,y-2);}
  });
  if(showCh)aiChannels.forEach(ch=>{
    const sr=ch.s,re=ch.r,g0=Math.max(sr.i0,re.i0),g1=Math.min(sr.i1,re.i1);
    if(g1<candles.length-N)return;
    const r0=g0-(candles.length-N),r1=g1-(candles.length-N);
    const x0=i2x(Math.max(0,r0),N,a),x1=i2x(Math.min(N-1,r1),N,a);
    ctx.fillStyle='rgba(151,117,250,.05)';ctx.beginPath();
    ctx.moveTo(x0,p2y(re.m*g0+re.b,mn,mx,a));ctx.lineTo(x1,p2y(re.m*g1+re.b,mn,mx,a));
    ctx.lineTo(x1,p2y(sr.m*g1+sr.b,mn,mx,a));ctx.lineTo(x0,p2y(sr.m*g0+sr.b,mn,mx,a));ctx.closePath();ctx.fill();
  });
  aiLines.forEach(tl=>{
    const isUp=tl.type==='support',col=isUp?'#3fb950':'#f85149';
    const i0r=tl.i0-(candles.length-N),i1r=tl.i1-(candles.length-N);if(i1r<-5)return;
    const x0=i2x(Math.max(0,i0r),N,a),x1=i2x(Math.min(N-1,i1r),N,a);
    const y0=p2y(tl.p0,mn,mx,a),y1=p2y(tl.p1,mn,mx,a),dx=x1-x0,dy=y1-y0;
    ctx.strokeStyle=col;ctx.lineWidth=mob?1.5:1.8;ctx.setLineDash([]);ctx.globalAlpha=.85;
    ctx.beginPath();ctx.moveTo(x0-dx*.2,y0-dy*.2);ctx.lineTo(x1+dx*2.2,y1+dy*2.2);ctx.stroke();ctx.globalAlpha=1;
    if(!mob){
      const lx=x0+dx*.45,ly=y0+dy*.45,label=`${isUp?'지지':'저항'} R²=${tl.r2.toFixed(2)}`;
      ctx.font='bold 10px Courier New';const tw=ctx.measureText(label).width+8;
      ctx.fillStyle=isUp?'rgba(63,185,80,.12)':'rgba(248,81,73,.12)';ctx.fillRect(lx,ly-(isUp?14:2),tw,13);
      ctx.fillStyle=col;ctx.textAlign='left';ctx.fillText(label,lx+3,ly+(isUp?-4:10));
    }
  });
  if(showCh)aiChannels.forEach(ch=>[ch.s,ch.r].forEach((tl,ti)=>{
    const i0r=tl.i0-(candles.length-N),i1r=tl.i1-(candles.length-N);if(i1r<-5)return;
    const x0=i2x(Math.max(0,i0r),N,a),x1=i2x(Math.min(N-1,i1r),N,a);
    const y0=p2y(tl.p0,mn,mx,a),y1=p2y(tl.p1,mn,mx,a),dx=x1-x0,dy=y1-y0;
    ctx.strokeStyle='#9775fa';ctx.lineWidth=1;ctx.setLineDash([7,5]);ctx.globalAlpha=.6;
    ctx.beginPath();ctx.moveTo(x0-dx*.2,y0-dy*.2);ctx.lineTo(x1+dx*2,y1+dy*2);ctx.stroke();ctx.globalAlpha=1;ctx.setLineDash([]);
    if(ti===0&&!mob){ctx.fillStyle='#bc8cff';ctx.font='bold 10px Courier New';ctx.textAlign='left';ctx.fillText(ch.label,x0+dx*.3+4,y0+dy*.3-4);}
  }));
  if(showPv&&!mob)aiPivots.forEach(pv=>{
    const ri=pv.i-(candles.length-N);if(ri<0||ri>=N)return;
    const x=i2x(ri,N,a),y=p2y(pv.p,mn,mx,a);ctx.beginPath();
    if(pv.type==='H'){ctx.moveTo(x-3,y-6);ctx.lineTo(x+3,y-6);ctx.lineTo(x,y-1);ctx.closePath();ctx.fillStyle='rgba(248,81,73,.75)';}
    else{ctx.moveTo(x-3,y+6);ctx.lineTo(x+3,y+6);ctx.lineTo(x,y+1);ctx.closePath();ctx.fillStyle='rgba(63,185,80,.75)';}
    ctx.fill();
  });
  if(showFib&&aiFib){
    const range=aiFib.high-aiFib.low;
    // 현재가와 가장 가까운 레벨 찾기
    const lastClose=candles.length?candles[candles.length-1].close:0;
    let nearIdx=-1,nearDist=Infinity;
    FIB_R.forEach((r,ri)=>{
      const p=aiFib.high-range*r,d=Math.abs(p-lastClose)/(lastClose||1);
      if(d<nearDist){nearDist=d;nearIdx=ri;}
    });

    FIB_R.forEach((r,ri)=>{
      const p=aiFib.high-range*r,y=p2y(p,mn,mx,a);
      if(y<a.y0-5||y>a.y1+5)return;
      const isKey=r===0.618,isNear=ri===nearIdx&&nearDist<0.005;

      // 라인
      ctx.strokeStyle=FIB_C[ri];
      ctx.lineWidth=isKey?2.2:isNear?1.8:1;
      ctx.setLineDash(isKey?[]:[5,4]);
      ctx.globalAlpha=isKey?1:isNear?0.9:0.6;
      if(isKey||isNear){ctx.save();ctx.shadowColor=FIB_C[ri];ctx.shadowBlur=isKey?10:6;}
      ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
      if(isKey||isNear)ctx.restore();

      // 레이블 — 초보자 친화적
      const shortL = FIB_L_SHORT[ri];
      const priceStr = '$'+fmt(p);
      const mob2 = isMob();

      if(mob2){
        // 모바일: 짧게
        const txt = shortL+' '+priceStr;
        ctx.font = isKey?'bold 9px Courier New':'8px Courier New';
        const fw = ctx.measureText(txt).width+8;
        const lx = a.x0+3;
        ctx.fillStyle='rgba(13,17,23,0.88)';
        ctx.fillRect(lx-2,y-10,fw,13);
        ctx.fillStyle = isNear?'#ffffff':FIB_C[ri];
        ctx.textAlign='left';
        ctx.fillText(txt,lx,y+1);
      } else {
        // 데스크탑: 레이블 + 가격 + 설명 뱃지
        const mainTxt = shortL+'  '+priceStr;
        const descTxt = FIB_DESC[ri];
        ctx.font = (isKey||isNear)?'bold 10px Courier New':'9px Courier New';
        const mw = ctx.measureText(mainTxt).width;
        ctx.font = '8px Courier New';
        const dw = ctx.measureText(descTxt).width;
        const totalW = Math.max(mw,dw)+14;
        const lx = a.x0+4;
        const boxH = isKey?28:22;

        // 배경박스
        ctx.fillStyle = isKey?`rgba(13,17,23,0.93)`:'rgba(13,17,23,0.85)';
        ctx.strokeStyle = FIB_C[ri]+'55';
        ctx.lineWidth=0.5;
        ctx.beginPath();
        ctx.roundRect(lx-2, y-(boxH/2)-1, totalW, boxH, 3);
        ctx.fill();
        if(isKey||isNear) ctx.stroke();

        // 메인 레이블
        ctx.font=(isKey||isNear)?'bold 10px Courier New':'9px Courier New';
        ctx.fillStyle=isNear?'#ffffff':FIB_C[ri];
        ctx.textAlign='left';
        ctx.fillText(mainTxt, lx+2, y-(boxH/2)+10);

        // 설명 텍스트
        ctx.font='7.5px Courier New';
        ctx.fillStyle=isKey?FIB_C[ri]:'rgba(255,255,255,0.35)';
        ctx.fillText(descTxt, lx+2, y+(boxH/2)-3);

        // 현재가 근접 표시
        if(isNear){
          ctx.font='bold 9px Courier New';
          ctx.fillStyle='#ffffff';
          ctx.fillText(' ◀ 현재가', lx+mw+6, y-(boxH/2)+10);
        }
        // 61.8% 특별 강조 뱃지
        if(isKey){
          const badgeTxt='⭐핵심';
          ctx.font='bold 8px Courier New';
          const bw=ctx.measureText(badgeTxt).width+8;
          ctx.fillStyle='rgba(255,112,67,0.25)';
          ctx.beginPath();
          ctx.roundRect(lx+mw+8, y-(boxH/2)+1, bw, 13, 2);
          ctx.fill();
          ctx.fillStyle='#ff7043';
          ctx.fillText(badgeTxt, lx+mw+12, y-(boxH/2)+10);
        }
      }
    });

    // 스윙 고점/저점 마커
    if(!mob){
      const N2=vis.length,base=candles.length-N2;
      const hiR=aiFib.i1-base,loR=aiFib.i0-base;
      if(hiR>=0&&hiR<N2){const x=i2x(hiR,N2,a),y=p2y(aiFib.high,mn,mx,a);ctx.fillStyle='rgba(255,107,107,.75)';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillText('▼H',x,y-4);}
      if(loR>=0&&loR<N2){const x=i2x(loR,N2,a),y=p2y(aiFib.low,mn,mx,a);ctx.fillStyle='rgba(100,220,150,.75)';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillText('▲L',x,y+11);}
    }
  }
  if(candles.length){
    const last=candles[candles.length-1],y=p2y(last.close,mn,mx,a),bull=last.close>=last.open;
    ctx.strokeStyle=bull?'rgba(38,166,154,.4)':'rgba(239,83,80,.4)';ctx.lineWidth=.6;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=bull?'#26a69a':'#ef5350';ctx.font=lf;ctx.textAlign='left';
    ctx.fillText('▶ $'+fmt(last.close),a.x1+2,y+3);
  }
}

/* ═══════ OVERLAY ═══════ */
function drawOverlay(mx,my){
  const a=area(),W=oc.clientWidth,H=CH();oct.clearRect(0,0,W,H);
  const vis=getVis();if(!vis.length)return;
  const{min:mn,max:mx2}=priceRange(vis);const N=vis.length;
  if(mx>a.x0&&mx<a.x1&&my>a.y0&&my<H-26){
    oct.strokeStyle='rgba(200,200,200,.18)';oct.lineWidth=.5;oct.setLineDash([4,4]);
    oct.beginPath();oct.moveTo(mx,a.y0);oct.lineTo(mx,a.y1);oct.stroke();
    oct.beginPath();oct.moveTo(a.x0,my);oct.lineTo(a.x1,my);oct.stroke();oct.setLineDash([]);
    if(my>=a.y0&&my<=a.y1){
      const p=y2p(my,mn,mx2,a);oct.fillStyle='rgba(22,27,34,.9)';oct.fillRect(a.x1+1,my-8,76,15);
      oct.strokeStyle='rgba(88,166,255,.3)';oct.lineWidth=.5;oct.strokeRect(a.x1+1,my-8,76,15);
      oct.fillStyle='#79c0ff';oct.font='10px Courier New';oct.textAlign='left';oct.fillText('$'+fmt(p),a.x1+4,my+2);
    }
    const ih=Math.max(0,Math.min(N-1,Math.floor((mx-a.x0)/((a.x1-a.x0)/N))));
    const c=vis[ih];
    if(c){
      const tip=document.getElementById('tip');tip.style.display='block';
      tip.style.left=Math.min(mx+14,W-190)+'px';tip.style.top=Math.max(a.y0,Math.min(my-10,H-45))+'px';
      const bull=c.close>=c.open,col=bull?'#3fb950':'#f85149';
      tip.innerHTML=`<span style="color:#8b949e">O:</span><span style="color:${col}">${fmt(c.open)}</span> <span style="color:#8b949e">H:</span><span style="color:#3fb950">${fmt(c.high)}</span> <span style="color:#8b949e">L:</span><span style="color:#f85149">${fmt(c.low)}</span> <span style="color:#8b949e">C:</span><span style="color:${col}">${fmt(c.close)}</span>`;
    }
  }
}
function hideTip(){oct.clearRect(0,0,oc.clientWidth,CH());document.getElementById('tip').style.display='none';}
mc.addEventListener('mousemove',e=>{const r=mc.getBoundingClientRect();drawOverlay(e.clientX-r.left,e.clientY-r.top);});
mc.addEventListener('mouseleave',hideTip);
let tTimer=null;
mc.addEventListener('touchstart',e=>{e.preventDefault();const r=mc.getBoundingClientRect(),t=e.touches[0];drawOverlay(t.clientX-r.left,t.clientY-r.top);},{passive:false});
mc.addEventListener('touchmove',e=>{e.preventDefault();const r=mc.getBoundingClientRect(),t=e.touches[0];drawOverlay(t.clientX-r.left,t.clientY-r.top);},{passive:false});
mc.addEventListener('touchend',()=>{clearTimeout(tTimer);tTimer=setTimeout(hideTip,1800);});

/* ═══════ OI (미결제약정) ═══════ */
async function fetchOIHistory(){
  if(currentExchange!=='binance') return;
  try{
    // 히스토리 OI (캔들과 동일 타임프레임)
    const url=`${FAPI}/openInterestHist?symbol=${currentSym}&period=${tf}&limit=100`;
    const r=await fetch(url);
    const data=await r.json();
    if(!Array.isArray(data)) return;
    oiHistory=data.map(d=>({t:+d.timestamp, oi:+d.sumOpenInterest, oiUsd:+d.sumOpenInterestValue}));
    drawOI();
    updateOISignal();
  }catch(e){ console.warn('OI fetch 실패:',e); }
}

async function fetchOICurrent(){
  if(currentExchange!=='binance') return;
  try{
    const r=await fetch(`${FAPI}/openInterest?symbol=${currentSym}`);
    const d=await r.json();
    if(!d.openInterest) return;
    const oi=+d.openInterest;
    const t=Date.now();
    // 히스토리에 현재값 추가/업데이트
    if(oiHistory.length&&oiHistory[oiHistory.length-1].t>t-60000){
      oiHistory[oiHistory.length-1]={t,oi,oiUsd:oi*(candles.at(-1)?.close||0)};
    } else {
      oiHistory.push({t,oi,oiUsd:oi*(candles.at(-1)?.close||0)});
      if(oiHistory.length>200) oiHistory.shift();
    }
    drawOI();
    updateOISignal();
  }catch(e){}
}

function startOIPoll(){
  if(oiPollId) clearInterval(oiPollId);
  fetchOIHistory();
  oiPollId=setInterval(()=>{ fetchOICurrent(); }, 10000); // 10초마다
}
function stopOIPoll(){
  if(oiPollId){ clearInterval(oiPollId); oiPollId=null; }
  oiHistory=[];
  drawOI();
}

function drawOI(){
  const W=OIC.parentElement.clientWidth;
  const H=OIC.parentElement.clientHeight;
  oiCtx.clearRect(0,0,W,H);
  oiCtx.fillStyle='#0d1117';
  oiCtx.fillRect(0,0,W,H);

  if(!oiHistory.length){
    oiCtx.fillStyle='#30363d';
    oiCtx.font='10px Courier New';
    oiCtx.textAlign='center';
    oiCtx.fillText(currentExchange==='binance'?'OI 로딩 중...':'OI: Binance 전용',W/2,H/2+3);
    return;
  }

  const PAD={l:8,r:70,t:18,b:4};
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;

  // 보이는 캔들 수에 맞게 OI 슬라이싱
  const vis=getVis();
  const N=Math.min(oiHistory.length, vis.length||100);
  const slice=oiHistory.slice(-N);

  const mn=Math.min(...slice.map(d=>d.oi));
  const mx=Math.max(...slice.map(d=>d.oi));
  const range=mx-mn||1;
  const pad=range*0.1;
  const lo=mn-pad, hi=mx+pad;

  const toY=v=>PAD.t+ch*(1-(v-lo)/(hi-lo));
  const toX=i=>PAD.l+(i/(N-1||1))*cw;

  // 그리드
  oiCtx.strokeStyle='rgba(255,255,255,.04)';
  oiCtx.lineWidth=.5;
  [0.25,0.5,0.75].forEach(r=>{
    const y=PAD.t+ch*r;
    oiCtx.beginPath();oiCtx.moveTo(PAD.l,y);oiCtx.lineTo(W-PAD.r,y);oiCtx.stroke();
  });

  // OI 변화 컬러 (증가=초록, 감소=빨강)
  // 막대 그래프
  const bw=Math.max(1,(cw/N)-1);
  slice.forEach((d,i)=>{
    const prev=slice[i-1];
    const isUp=!prev||d.oi>=prev.oi;
    const y=toY(d.oi);
    const baseY=toY(lo);
    const x=toX(i)-bw/2;
    oiCtx.fillStyle=isUp?'rgba(38,166,154,.5)':'rgba(239,83,80,.45)';
    oiCtx.fillRect(x, y, bw, baseY-y);
  });

  // OI 라인
  oiCtx.beginPath();
  slice.forEach((d,i)=>{
    const x=toX(i), y=toY(d.oi);
    i===0?oiCtx.moveTo(x,y):oiCtx.lineTo(x,y);
  });
  oiCtx.strokeStyle='#58a6ff';
  oiCtx.lineWidth=1.5;
  oiCtx.stroke();

  // 가격 상승 시 OI 변화 시각화 (캔들과 비교)
  if(vis.length&&slice.length){
    const lastOI=slice.at(-1);
    const prevOI=slice.at(-5)||slice[0];
    const oiChgPct=((lastOI.oi-prevOI.oi)/prevOI.oi*100);

    // 현재 OI 라벨
    const oiK=lastOI.oi>1000?(lastOI.oi/1000).toFixed(1)+'K':lastOI.oi.toFixed(0);
    document.getElementById('oi-val').textContent=oiK;
    const chgEl=document.getElementById('oi-chg');
    chgEl.textContent=(oiChgPct>=0?'+':'')+oiChgPct.toFixed(2)+'%';
    chgEl.style.color=oiChgPct>=0?'#26a69a':'#ef5350';

    // 현재값 마커
    const lastX=toX(N-1), lastY=toY(lastOI.oi);
    oiCtx.fillStyle='#58a6ff';
    oiCtx.beginPath();oiCtx.arc(lastX,lastY,3,0,Math.PI*2);oiCtx.fill();

    // 우측 라벨
    oiCtx.fillStyle='rgba(13,17,23,.9)';
    oiCtx.fillRect(W-PAD.r+1,lastY-8,PAD.r-2,16);
    oiCtx.fillStyle='#79c0ff';
    oiCtx.font='bold 9px Courier New';
    oiCtx.textAlign='left';
    oiCtx.fillText(oiK,W-PAD.r+4,lastY+3);
  }

  // 최고/최저 표시
  oiCtx.font='8px Courier New';
  oiCtx.fillStyle='rgba(255,255,255,.3)';
  oiCtx.textAlign='left';
  const mxIdx=slice.indexOf(slice.reduce((a,b)=>a.oi>b.oi?a:b));
  const mnIdx=slice.indexOf(slice.reduce((a,b)=>a.oi<b.oi?a:b));
  if(mxIdx>=0){const x=toX(mxIdx),y=toY(slice[mxIdx].oi);oiCtx.fillStyle='rgba(88,166,255,.6)';oiCtx.fillText('▲'+(slice[mxIdx].oi>1000?(slice[mxIdx].oi/1000).toFixed(1)+'K':slice[mxIdx].oi.toFixed(0)),Math.min(x,W-PAD.r-40),Math.max(y-4,PAD.t+10));}
  if(mnIdx>=0){const x=toX(mnIdx),y=toY(slice[mnIdx].oi);oiCtx.fillStyle='rgba(239,83,80,.6)';oiCtx.fillText('▼'+(slice[mnIdx].oi>1000?(slice[mnIdx].oi/1000).toFixed(1)+'K':slice[mnIdx].oi.toFixed(0)),Math.min(x,W-PAD.r-40),Math.min(y+10,H-PAD.b-2));}
}

// CORS 우회: 여러 엔드포인트 순차 시도
async function hlPost(body) {
  const endpoints = [
    'https://api.hyperliquid.xyz/info',
    'https://api-ui.hyperliquid.xyz/info',
  ];
  let lastErr;
  for (const url of endpoints) {
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        mode: 'cors',
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch(e) { lastErr = e; }
  }
  throw lastErr;
}

// HL 캔들 로드 (POST /info)
async function loadHLCandles(sym, interval) {
  const now = Date.now();
  const tfMs = {'1m':60000,'5m':300000,'15m':900000,'1h':3600000,'4h':14400000,'1d':86400000};
  const ms = tfMs[interval] || 60000;
  const startTime = now - ms * 300;

  const data = await hlPost({
    type: 'candleSnapshot',
    req: { coin: sym, interval: HL_TF_MAP[interval], startTime, endTime: now }
  });
  if (!Array.isArray(data) || data.length < 2) throw new Error('캔들 없음');
  return data.map(d => ({
    time: +d.t, open: +d.o, high: +d.h, low: +d.l, close: +d.c, vol: +d.v
  }));
}

// HL 현재가 (REST)
async function fetchHLPrice(sym) {
  const data = await hlPost({ type: 'allMids' });
  return data[sym] ? +data[sym] : 0;
}

// HL WebSocket
let hlWs = null;
let hlWsRetry = 0;

function connectHLWS(sym) {
  if (hlWs) { try { hlWs.close(); } catch(e){} }
  try {
    hlWs = new WebSocket('wss://api.hyperliquid.xyz/ws');
  } catch(e) { scheduleHLRetry(sym); return; }

  hlWs.onopen = () => {
    hlWsRetry = 0;
    // 캔들 구독
    hlWs.send(JSON.stringify({
      method: 'subscribe',
      subscription: { type: 'candle', coin: sym, interval: HL_TF_MAP[tf] }
    }));
    // 현재가 구독
    hlWs.send(JSON.stringify({
      method: 'subscribe',
      subscription: { type: 'trades', coin: sym }
    }));
    setStatus('WebSocket 실시간 · Hyperliquid', 'ws');
  };

  hlWs.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      const ch = msg.channel, d = msg.data;
      if (!ch || !d) return;

      // 캔들 업데이트 — open 보존 버그 수정
      if (ch === 'candle' && d.s === sym) {
        const incoming = { time:+d.t, open:+d.o, high:+d.h, low:+d.l, close:+d.c, vol:+d.v };
        if(!incoming.time||!incoming.open||!incoming.close) return;
        const last = candles[candles.length-1];
        if (last && last.time === incoming.time) {
          // open 절대 유지!
          last.high  = Math.max(last.high, incoming.high);
          last.low   = Math.min(last.low,  incoming.low);
          last.close = incoming.close;
          last.vol   = incoming.vol;
        } else {
          candles.push(incoming);
          if(candles.length>800) candles.shift();
          scheduleAI();
        }
        scheduleDraw();
      }

      // 실시간 체결가
      if (ch === 'trades' && Array.isArray(d) && d.length) {
        const p = +d[d.length-1].px;
        if (p > 0) {
          updatePrice(p, 0, 0, 0, 0);
          if (candles.length) {
            const last = candles[candles.length-1];
            // open 절대 건드리지 않음!
            if (p > last.high) last.high = p;
            if (p < last.low)  last.low  = p;
            last.close = p;
            checkFibAlert(p);
          }
          scheduleDraw();
        }
      }
    } catch(err) {}
  };

  hlWs.onclose = () => scheduleHLRetry(sym);
  hlWs.onerror = () => { try{hlWs.close();}catch(e){} };
}

function scheduleHLRetry(sym) {
  hlWsRetry++;
  const delay = Math.min(hlWsRetry * 3000, 15000);
  setStatus(`HL WS 재연결 대기 (${delay/1000}s)`, 'rest');
  setTimeout(() => { if(currentExchange==='hyperliquid') connectHLWS(sym); }, delay);
}

    try {
      const p = await fetchHLPrice(sym);
      if (p > 0) {
        updatePrice(p, 0, 0, 0, 0);
        if (candles.length) {
          const last = candles[candles.length-1];
          // open 절대 건드리지 않음!
          if (p > last.high) last.high = p;
          if (p < last.low)  last.low  = p;
          last.close = p;
          scheduleDraw();
        }
      }
    } catch(e) {}
  }, 3000);
}

async function loadHLChart(sym) {

  // 최대 3번 재시도
  let lastErr;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      document.getElementById('spin-msg').textContent =
        attempt > 1 ? `재시도 중... (${attempt}/3)` : `HL ${sym} 캔들 로딩...`;

      const klines = await loadHLCandles(sym, tf);
      candles = klines;

      // 현재가 가져오기
      try {
        const p = await fetchHLPrice(sym);
        if (p > 0) updatePrice(p, 0, 0, 0, candles[0]?.open || 0);
        else {
          const last = candles[candles.length-1];
          updatePrice(last.close, last.high, last.low, 0, candles[0].open);
        }
      } catch(e) {
        const last = candles[candles.length-1];
        updatePrice(last.close, last.high, last.low, 0, candles[0].open);
      }

      document.getElementById('spin-wrap').style.display = 'none';
      runAI(getVis()); draw();
      startHLPolling(sym);
      connectHLWS(sym);
      return; // 성공 시 종료

    } catch(e) {
      lastErr = e;
      console.error(`HL 로드 시도 ${attempt} 실패:`, e);
      if (attempt < 3) await new Promise(r => setTimeout(r, 1500 * attempt));
    }
  }

  // 3번 모두 실패
  document.getElementById('spin-msg').textContent =
    `⚠ HL API 연결 실패\nSafari → 설정 → 무선데이터 확인\n(${lastErr?.message||'CORS 오류'})`;
  console.error('HL load error:', lastErr);

  // 폴링만으로 가격은 시도
  startHLPolling(sym);
}

    console.log(`바이낸스 선물 ${symbols.length}개 코인 로드 완료`);
    return symbols;
  }catch(e){
    console.warn('코인 목록 로드 실패, 기본 목록 사용:', e);
    // 폴백: 기본 코인 목록

}
