let activeCoinCat = '전체';

function renderPanelCoins(list){
  const el=document.getElementById('coin-panel-list');
  if(!el) return;
  const isHL=currentExchange==='hyperliquid';

  // 카테고리 탭 (Binance만)
  if(!isHL){
    const cats=['전체','🔵 L1','⚡ L2','💱 DeFi','🐸 밈','🤖 AI','🎮 게임','◆ 기타'];
    const tabHTML=`<div style="display:flex;gap:4px;padding:6px 8px 8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid #1e2736" id="cat-tabs">
      ${cats.map(c=>`<button onclick="setCoinCat('${c}')"
        style="flex-shrink:0;padding:4px 10px;border-radius:20px;border:1px solid ${activeCoinCat===c?'#388bfd':'#30363d'};
        background:${activeCoinCat===c?'rgba(56,139,253,.2)':'transparent'};
        color:${activeCoinCat===c?'#58a6ff':'#8b949e'};
        font-family:Courier New,monospace;font-size:11px;cursor:pointer;white-space:nowrap">${c}
        ${c==='전체'?`<span style="font-size:9px;color:#484f58">(${list.length})</span>`:''}
      </button>`).join('')}
    </div>`;

    // 필터 적용
    const filtered = activeCoinCat==='전체' ? list : list.filter(c=>c.cat===activeCoinCat);

    // 로딩 중이면 스피너
    if(!coinListLoaded){
      el.innerHTML=tabHTML+`<div style="text-align:center;padding:30px;color:#484f58;font-family:Courier New,monospace;font-size:12px">
        ⏳ 코인 목록 로딩 중...
      </div>`;
      return;
    }

    el.innerHTML=tabHTML+filtered.map(c=>{
      const isActive=currentSym===c.sym;
      const pStr=c.price?(c.price>1000?'$'+Math.round(c.price).toLocaleString():c.price>1?'$'+c.price.toFixed(3):'$'+c.price.toFixed(6)):'';
      const chgCol=c.chg>=0?'#34d399':'#f87171';
      const chgStr=c.chg?(c.chg>=0?'+':'')+c.chg.toFixed(2)+'%':'';
      const volStr=c.vol>1e9?(c.vol/1e9).toFixed(1)+'B':c.vol>1e6?(c.vol/1e6).toFixed(0)+'M':'';

      return`<div onclick="selectCoinFromPanel('${c.sym}','${c.icon}')"
        style="display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;
          padding:9px 14px;cursor:pointer;transition:background .1s;
          background:${isActive?'rgba(56,139,253,.12)':'transparent'};
          border-left:3px solid ${isActive?'#388bfd':'transparent'};
          border-bottom:1px solid #0f1623">
        <div style="font-size:20px;text-align:center;line-height:1">${c.icon}</div>
        <div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-family:Courier New,monospace;font-size:13px;font-weight:700;color:${isActive?'#58a6ff':'#e2e8f0'}">${c.name}</span>
            <span style="font-size:9px;color:#484f58;background:#1a2030;padding:1px 5px;border-radius:3px">${c.cat||''}</span>
            ${isActive?`<span style="font-size:9px;color:#3fb950;font-weight:700">● 현재</span>`:''}
          </div>
          <div style="font-size:10px;color:#4a5568;margin-top:1px;font-family:Courier New,monospace">
            ${volStr?`Vol $${volStr}`:''}
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:Courier New,monospace;font-size:12px;font-weight:700;color:#c9d1d9">${pStr}</div>
          ${chgStr?`<div style="font-size:11px;color:${chgCol};font-weight:600;margin-top:2px">${chgStr}</div>`:''}
        </div>
      </div>`;
    }).join('');
    return;
  }

  // Hyperliquid 코인 (기존 방식)
  el.innerHTML=HL_COIN_LIST.map(c=>{
    const isActive=currentSym===c.sym;
    return`<div onclick="selectCoinFromPanel('${c.sym}','${c.icon}')"
      style="display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;
        padding:9px 14px;cursor:pointer;transition:background .1s;
        background:${isActive?'rgba(0,194,255,.1)':'transparent'};
        border-left:3px solid ${isActive?'#00c2ff':'transparent'};
        border-bottom:1px solid #0f1623">
      <div style="font-size:20px;text-align:center">${c.icon}</div>
      <div>
        <div style="font-family:Courier New,monospace;font-size:13px;font-weight:700;color:${isActive?'#00c2ff':'#e2e8f0'}">${c.sym}</div>
        <div style="font-size:10px;color:#4a5568">${c.name}</div>
      </div>
      ${isActive?`<div style="font-size:10px;color:#3fb950;font-weight:700">● 현재</div>`:''}
    </div>`;
  }).join('');
}

function setCoinCat(cat){
  activeCoinCat=cat;
  renderPanelCoins(COIN_LIST);
  // 스크롤 상단으로
  const el=document.getElementById('coin-panel-list');

}

function filterPanelCoins(val){
  const q=val.trim().toUpperCase();
  const isHL=currentExchange==='hyperliquid';
  const list=isHL?HL_COIN_LIST:COIN_LIST;
  if(!q){
    activeCoinCat='전체';
    renderPanelCoins(list);
    return;
  }
  const filtered=list.filter(c=>
    c.sym.replace('USDT','').includes(q)||
    (c.name&&c.name.toUpperCase().includes(q))
  );
  // 직접입력 지원
  if(!isHL&&!list.some(c=>c.sym===q+'USDT')&&q.length>=2)
    filtered.push({sym:q+'USDT',name:'직접입력',icon:'🔍',cat:'',vol:0,price:0,chg:0});
  if(isHL&&!list.some(c=>c.sym===q)&&q.length>=1)
    filtered.push({sym:q,name:'직접입력',icon:'🔍'});
  // 필터된 결과는 카테고리탭 없이 바로 표시
  const el=document.getElementById('coin-panel-list');
  if(!el) return;
  el.innerHTML=filtered.length
    ? filtered.map(c=>{
        const isActive=currentSym===c.sym;
        const pStr=c.price?(c.price>1000?'$'+Math.round(c.price).toLocaleString():c.price>1?'$'+c.price.toFixed(3):'$'+c.price.toFixed(6)):'';
        const chgCol=(c.chg||0)>=0?'#34d399':'#f87171';
        return`<div onclick="selectCoinFromPanel('${c.sym}','${c.icon||'◆'}')"
          style="display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;
            padding:10px 14px;cursor:pointer;
            background:${isActive?'rgba(56,139,253,.12)':'transparent'};
            border-left:3px solid ${isActive?'#388bfd':'transparent'};
            border-bottom:1px solid #0f1623">
          <div style="font-size:20px;text-align:center">${c.icon||'◆'}</div>
          <div>
            <div style="font-family:Courier New,monospace;font-size:13px;font-weight:700;color:${isActive?'#58a6ff':'#e2e8f0'}">${isHL?c.sym:c.sym.replace('USDT','')}</div>
            <div style="font-size:10px;color:#4a5568">${c.name||''}</div>
          </div>
          <div style="text-align:right">
            ${pStr?`<div style="font-family:Courier New,monospace;font-size:12px;font-weight:700;color:#c9d1d9">${pStr}</div>`:''}
            ${c.chg?`<div style="font-size:11px;color:${chgCol}">${c.chg>=0?'+':''}${c.chg.toFixed(2)}%</div>`:''}
          </div>
        </div>`;
      }).join('')
    : `<div style="text-align:center;padding:30px;color:#484f58;font-family:Courier New,monospace">검색 결과 없음</div>`;
}

function selectCoinFromPanel(sym,icon){
  hideCoinPanel();
  const label=icon+' '+sym.replace('USDT','');
  document.getElementById('coin-picker-label').textContent=label;
  if(currentExchange==='hyperliquid'){

<script>
/* ── 위젯 업데이트 ── */
function updateWidget(sig, price, chgStr) {
  const dir = sig.direction;
  const col = dir==='buy'?'#3fb950':dir==='sell'?'#f85149':'#8b949e';

  // 방향
  const dirEl = document.getElementById('sw-dir');
  dirEl.textContent = dir==='buy'?'▲ 매수':dir==='sell'?'▼ 매도':'— 중립';
  dirEl.style.color = col;

  // 강도 바
  document.getElementById('sw-bar').style.width = sig.strength + '%';
  document.getElementById('sw-bar').style.background = col;

  // verdict
  const v = document.getElementById('sw-verdict');
  let msg = '';
  if(dir==='buy')       msg = '▲ '+(sig.strength>70?'강한 매수':sig.strength>40?'매수 신호':'약한 매수');
  else if(dir==='sell') msg = '▼ '+(sig.strength>70?'강한 매도':sig.strength>40?'매도 신호':'약한 매도');
  else                  msg = '— 관망';
  v.textContent = msg;
  if(dir==='buy'){
    v.style.cssText='width:100%;font-size:11px;font-weight:500;padding:4px 0;border-radius:5px;text-align:center;background:rgba(63,185,80,.13);color:#3fb950;border:1px solid rgba(63,185,80,.35)';
  }else if(dir==='sell'){
    v.style.cssText='width:100%;font-size:11px;font-weight:500;padding:4px 0;border-radius:5px;text-align:center;background:rgba(248,81,73,.13);color:#f85149;border:1px solid rgba(248,81,73,.35)';
  }else{
    v.style.cssText='width:100%;font-size:11px;font-weight:500;padding:4px 0;border-radius:5px;text-align:center;background:#21262d;color:#8b949e;border:1px solid #30363d';
  }

  // 가격
  const priceEl = document.getElementById('sw-price');
  if(price>0){ priceEl.textContent='$'+fmt(price); priceEl.style.color=col; }

  // 변동률
  const chgEl = document.getElementById('sw-chg');
  if(chgStr){
    const up = chgStr.startsWith('+');
    chgEl.textContent = chgStr;
    chgEl.style.cssText = 'font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500;'
      +(up?'background:rgba(63,185,80,.12);color:#3fb950;border:1px solid rgba(63,185,80,.3)'
          :'background:rgba(248,81,73,.12);color:#f85149;border:1px solid rgba(248,81,73,.3)');
  }

  // 지표
  const rsiC = sig.rsi>70?'#f85149':sig.rsi<30?'#3fb950':'#e6edf3';
  const mh = sig.macd?.hist||0;
  const mC = mh>0?'#3fb950':'#f85149';
  const bp = sig.bb?.pct||50;
  const bC = bp>75?'#f85149':bp<25?'#3fb950':'#e6edf3';

  const rsiEl=document.getElementById('sw-rsi'); rsiEl.textContent=sig.rsi.toFixed(1); rsiEl.style.color=rsiC;
  const mEl=document.getElementById('sw-macd');  mEl.textContent=(mh>0?'+':'')+mh.toFixed(1); mEl.style.color=mC;
  const bEl=document.getElementById('sw-bb');    bEl.textContent=bp.toFixed(0)+'%'; bEl.style.color=bC;

  document.getElementById('sw-time').textContent = new Date().toLocaleTimeString('ko-KR');
}

/* ── updateSignalPanel 후크 ── */
const _origSP = updateSignalPanel;
updateSignalPanel = function(sig) {
  _origSP(sig);
  const last = candles[candles.length-1];
  if(!last) return;
  const chStr = openPrice>0
    ? ((last.close-openPrice)/openPrice*100).toFixed(2)
    : '';
  updateWidget(sig, last.close, chStr ? (parseFloat(chStr)>=0?'+':'')+chStr+'%' : '');
};

/* ── 가격만 실시간 반영 (updatePrice 후크) ── */
const _origUP = updatePrice;
updatePrice = function(price, high, low, vol, op) {
  _origUP(price, high, low, vol, op);
  if(price>0){
    const priceEl = document.getElementById('sw-price');
    priceEl.textContent = '$'+fmt(price);
    const last = candles[candles.length-1];
    const curOpenPrice = op>0 ? op : openPrice;
    if(curOpenPrice>0 && price>0){
      const ch = ((price-curOpenPrice)/curOpenPrice*100).toFixed(2);
      const chEl = document.getElementById('sw-chg');
      const up = parseFloat(ch)>=0;
      chEl.textContent = (up?'+':'')+ch+'%';
      chEl.style.cssText = 'font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500;'
        +(up?'background:rgba(63,185,80,.12);color:#3fb950;border:1px solid rgba(63,185,80,.3)'
            :'background:rgba(248,81,73,.12);color:#f85149;border:1px solid rgba(248,81,73,.3)');
    }
  }
};

/* ── 드래그 이동 ── */
(function(){
  const sw = document.getElementById('sw');
  const bar = document.getElementById('sw-topbar');
  let dx=0,dy=0,dragging=false,startX=0,startY=0;

  function startDrag(ex,ey){
    dragging=true;
    const r=sw.getBoundingClientRect();
    dx=ex-r.left; dy=ey-r.top;
    sw.style.transition='none';
    sw.style.right='auto';sw.style.bottom='auto';
    sw.style.left=r.left+'px';sw.style.top=r.top+'px';
  }
  function moveDrag(ex,ey){
    if(!dragging)return;
    let nx=ex-dx, ny=ey-dy;
    nx=Math.max(0,Math.min(nx,window.innerWidth-sw.offsetWidth));
    ny=Math.max(0,Math.min(ny,window.innerHeight-sw.offsetHeight));
    sw.style.left=nx+'px';sw.style.top=ny+'px';
  }
  function endDrag(){ dragging=false; sw.style.transition=''; }

  bar.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>moveDrag(e.clientX,e.clientY));
  document.addEventListener('mouseup',endDrag);
  bar.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:false});
  document.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  document.addEventListener('touchend',endDrag);
})();

/* ── 숨기기 / 열기 ── */
document.getElementById('sw-close').addEventListener('click',()=>{
  document.getElementById('sw').classList.add('sw-hidden');
  document.getElementById('sw-toggle').classList.add('sw-tog-show');
});
document.getElementById('sw-toggle').addEventListener('click',()=>{
  const sw=document.getElementById('sw');
  sw.classList.remove('sw-hidden');
  sw.style.left=''; sw.style.top='';
  sw.style.right='18px'; sw.style.bottom='18px';
  document.getElementById('sw-toggle').classList.remove('sw-tog-show');
});
</script>
